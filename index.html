<!DOCTYPE html>
<html lang="en" data-theme="navy">
<head>
<meta charset="utf-8">

<title>TSH 海外営業デスク · Export Desk</title>
<style>
:root,html[data-theme=navy]{--navy:#16233f;--navy2:#22335a;--gold:#b8935a;--gold2:#dcc9a3;--bg:#f4f1ea}
html[data-theme=forest]{--navy:#173a2e;--navy2:#24533f;--gold:#b59a5a;--gold2:#d9ccab;--bg:#f1f1e9}
html[data-theme=bordeaux]{--navy:#44202e;--navy2:#5e3042;--gold:#c2977f;--gold2:#e4cdbf;--bg:#f6f0ed}
html[data-theme=slate]{--navy:#272b33;--navy2:#3a404b;--gold:#b97a52;--gold2:#e0c3ae;--bg:#f1f0ee}
:root{--acc:var(--navy);--acc-soft:color-mix(in srgb,var(--navy) 8%,#fff);--ink:#1c2230;--mut:#6b7385;--card:#fff;--line:#e4dfd2;--ok:#2f7d57;--warn:#b7791f;--err:#b4373d}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
#app{display:flex;min-height:100vh}
#side{width:228px;background:linear-gradient(180deg,var(--navy),color-mix(in srgb,var(--navy) 78%,#000));color:#e9e6dd;display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}

.logoplate{background:#fff;border-radius:8px;padding:5px 7px;display:flex;align-items:center;justify-content:center;min-width:52px;height:42px}
.logoplate img{max-height:32px;max-width:78px;display:block}
.mono{width:38px;height:32px;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;letter-spacing:1px;font-size:13px;color:var(--navy)}
.brand b{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-size:15px;display:block;line-height:1.2;color:#fff}
.brand small{color:var(--gold2);font-size:11px}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#cfd3de;padding:10px 12px;border-radius:7px;cursor:pointer;font:inherit;margin-bottom:2px}
.nav button:hover{background:#ffffff14}
.nav button.on{background:#ffffff1f;color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav .jp{font-size:10.5px;opacity:.65}
.sidefoot{margin-top:auto;font-size:11px;color:#a5adc0;padding:8px 6px;line-height:1.6}
.kbd{display:inline-block;border:1px solid #ffffff44;border-radius:4px;padding:0 5px;font-size:10px;margin:0 2px}
main{flex:1;min-width:0}
#top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 24px;background:#fffdf9ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--ink);padding:6px 10px;cursor:pointer;font:inherit;font-size:12px;border-radius:0}
.seg button:hover{background:#f4f0e4}
.seg button.on{background:var(--navy);color:#fff}
.grow{flex:1}

.bkwarn{background:#fdf1d8;color:#8a5a00;border:1px solid #ecd49b;border-radius:99px;padding:3px 11px;font-size:12px;cursor:pointer}
#view{padding:24px 26px 70px;max-width:1320px}
h1{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-size:25px;margin:0 0 4px;color:var(--navy);letter-spacing:.2px}
h2{font-family:Georgia,"Hiragino Mincho ProN",serif;font-size:16.5px;margin:0 0 12px;color:var(--navy)}
h2:after{content:"";display:block;width:34px;height:2px;background:var(--gold);margin-top:5px}
.sub{color:var(--mut);margin:0 0 18px}
.jp{display:block;font-size:.78em;opacity:.7;font-weight:400}
button .jp,.btn .jp,.tabs .jp,option .jp{display:inline;margin-left:.45em}
h1 .jp,h2 .jp{color:var(--mut)}
h1 .jp{font-size:.52em;margin-top:2px}h2 .jp{font-size:.7em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px #0001,0 6px 18px -12px #0003}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.gdash{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}
@media(max-width:1000px){.gdash{grid-template-columns:1fr}.g5{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){#app{flex-direction:column}#side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;gap:4px}.brand{border:0;padding:0;margin:0}.nav{display:flex;flex-wrap:wrap}.nav button{width:auto}.sidefoot{display:none}.g2,.g3,.g4{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
label.f>span .jp{display:inline;margin-left:.4em}
input,select,textarea{font:inherit;font-size:13.5px;color:var(--ink);border:1px solid #d9d3c4;border-radius:7px;padding:7px 9px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold2);border-color:var(--gold)}
input[type=range]{padding:0;accent-color:var(--navy)}
textarea{resize:vertical}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink);cursor:pointer}
.chk input{width:auto;accent-color:var(--navy)}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:7px 14px;border-radius:7px;cursor:pointer;transition:.15s}
button:hover{background:var(--navy2)}
button.ghost{background:#fff;color:var(--navy)}button.ghost:hover{background:#f4f0e4}
button.gold{background:var(--gold);border-color:var(--gold)}button.gold:hover{filter:brightness(.92)}
button.danger{background:#fff;color:var(--err);border-color:#e3b9bc}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.tabs button:hover{background:#0000000a}
.steps{display:flex;gap:0;margin:0 0 16px;flex-wrap:wrap}
.steps button{background:#fff;color:var(--mut);border:1px solid var(--line);border-radius:0;padding:7px 16px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%);margin-left:-8px;min-width:112px}
.steps button:first-child{margin-left:0;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%)}

.kpi{border-left:3px solid var(--gold);margin:0}

.kpi b{font-family:Georgia,serif;font-size:21px;color:var(--navy)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;background:#eee;color:#444}

.bar{height:6px;background:#eee9dc;border-radius:9px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--gold)}
.hbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px}.hbar span{width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar .bar{flex:1;height:9px}.hbar em{font-style:normal;color:var(--mut);width:84px;text-align:right}
.chkrow{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid #eee9dc}
.chkrow.done span{color:var(--mut);text-decoration:line-through}
.msg{padding:9px 12px;border-radius:8px;margin-bottom:7px;font-size:13.5px;border-left:4px solid}
.msg.err{background:#fbeceb;border-color:var(--err)}.msg.warn{background:#fdf5e3;border-color:var(--warn)}.msg.ok{background:#e9f5ee;border-color:var(--ok)}.msg.info{background:#eaf0fb;border-color:#3b64b8}
.totbox{display:flex;gap:26px;flex-wrap:wrap;justify-content:flex-end;padding:12px 6px;font-size:13px;color:var(--mut)}
.totbox b{display:block;color:var(--navy);font-size:17px;font-family:Georgia,serif}
.ev{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #eee9dc;font-size:13px}
.ev .d{width:56px;font-weight:600;color:var(--navy)}.ev .k{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--acc-soft);color:var(--navy)}
.ev.late .d,.ev.late{color:var(--err)}
.hint{font-size:10.5px;color:var(--mut);margin-top:1px}.hint.up{color:var(--err)}.hint.dn{color:var(--ok)}
.docs{display:flex;gap:18px;align-items:flex-start}
.doclist{width:236px;flex-shrink:0;position:sticky;top:70px;max-height:calc(100vh - 84px);overflow:auto;padding-right:2px}
.doclist>button{display:block;width:100%;text-align:left;margin-bottom:5px;background:#fff;color:var(--ink);border:1px solid var(--line)}
.doclist>button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.doclist .card{padding:12px 14px;margin:10px 0}
.doclist details summary{cursor:pointer;font-weight:600;color:var(--navy);margin-bottom:8px}
.doclist .grid{gap:8px}
.pvwrap{flex:1;min-width:0;overflow:auto;background:#d9d4c7;padding:20px;border-radius:12px}
.pv{width:fit-content;margin:0 auto}
@media(max-width:900px){.docs{flex-direction:column}.doclist{width:100%;position:static;max-height:none}}
textarea.mail{min-height:240px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.note{font-size:12px;color:var(--mut)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:96px;border:2px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;text-align:center;font-size:11.5px;background:#fff}
.sw i{display:block;height:26px;border-radius:6px;margin-bottom:4px}
.sw.on{border-color:var(--gold)}
dialog{border:0;border-radius:14px;padding:22px;width:min(640px,94vw);box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#14213d88}
#cmd{padding:0;width:min(560px,94vw);margin-top:12vh}
#cmd input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:16px}
#cmd input:focus{outline:0}
#cmdList div{padding:10px 18px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
#cmdList div.on{background:var(--acc-soft)}#cmdList small{color:var(--mut)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.3s;z-index:99;font-size:13px}
#toast.on{opacity:1}
#printArea{display:none}
@media print{#app,#toast,dialog{display:none!important}#printArea{display:block}body{background:#fff}}
</style>
<style id="paperCss"></style>
<style id="pageCss">@page{size:A4;margin:0}</style>

<script>
/* Logo: replaced at build time with a data: URI of tsh.png (empty = look for tsh.png next to this file) */
const LOGO_DEFAULT = '';

/* ========== Paper (document) CSS – shared by screen preview, print and exported file ========== */
const PAPER_CSS = `
.paper{width:var(--pw,210mm);min-height:var(--ph,297mm);background:#fff;color:#000;padding:var(--pad,12mm);padding-bottom:calc(var(--pad,12mm) + 7mm);box-sizing:border-box;font-family:Arial,"Hiragino Sans","Yu Gothic",sans-serif;font-size:calc(9.2pt*var(--k,1));line-height:1.35;margin:0 auto 14px;box-shadow:0 2px 12px #0003;position:relative;overflow:hidden}
.paper small.ja{display:block;font-size:.76em;color:#555;font-weight:400;letter-spacing:0}
.paper .dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2.5px solid var(--acc,#16233f);padding-bottom:.75em;margin-bottom:1em}
.paper .hl{display:flex;gap:10px;align-items:center}
.paper .dlogo{display:block;width:auto;max-width:44mm;object-fit:contain}
.paper .cname{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:1.5em;color:var(--acc,#16233f);letter-spacing:.3px}
.paper .caddr{font-size:.84em;color:#333;margin-top:2px;max-width:104mm}
.paper .dtitle{font-family:Georgia,serif;font-weight:700;font-size:1.85em;color:var(--acc,#16233f);text-align:right;letter-spacing:1px;white-space:nowrap}
.paper .dtitle small.ja{text-align:right;font-family:Arial,"Hiragino Sans",sans-serif;font-size:.45em}
.paper .ctag{display:inline-block;margin-top:3px;border:1px solid var(--acc,#16233f);color:var(--acc,#16233f);font-size:.72em;font-weight:700;letter-spacing:2px;padding:0 6px}
.paper .two{display:grid;grid-template-columns:1.1fr 1fr;border:1px solid #222;margin-bottom:.65em}
.paper .two>div{padding:.55em .8em}
.paper .two>div+div{border-left:1px solid #222}
.paper .lbl{font-size:.8em;color:#444}
.paper .val{font-weight:700;white-space:pre-line}
.paper .kv{display:grid;grid-template-columns:10.5em 1fr;gap:.2em .65em;margin:0}
.paper .ship{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid #222;margin-bottom:.65em}
.paper .ship>div{padding:.45em .8em;border-right:1px solid #222}.paper .ship>div:last-child{border-right:0}
.paper .ship>div:nth-child(n+4){border-top:1px solid #222}
.paper table.it{width:100%;border-collapse:collapse;border:1px solid #222}
.paper table.it thead{display:table-header-group}
.paper table.it tr{break-inside:avoid;page-break-inside:avoid}
.paper table.it th{background:var(--acc-soft,#eef0f5);font-size:.85em;border:1px solid #222;padding:.35em .45em;text-align:center}
.paper table.it td{padding:.27em .55em;border-left:1px solid #222;border-right:1px solid #222;vertical-align:top}
.paper.compact table.it td{padding:.08em .45em}
.paper table.it tr.last td{border-bottom:1px solid #222}
.paper table.it td.r{text-align:right;white-space:nowrap}.paper table.it td.c{text-align:center}
.paper table.it td.mk{font-size:.83em;font-weight:700;white-space:pre-line;vertical-align:top;line-height:1.5}
.paper table.it tr.tot td{border-top:1.5px solid #222;border-bottom:1.5px solid #222;font-weight:700;background:var(--acc-soft,#f4f4f4)}
.paper .sec{border:1px solid #222;border-top:0;padding:.55em .8em}
.paper .words{font-weight:700;font-size:.9em;margin-top:2px}
.paper .hss{margin-top:.9em;font-size:.88em}
.paper .hss table{border-collapse:collapse;width:100%}.paper .hss th,.paper .hss td{border:1px solid #888;padding:1px 5px;text-align:left}.paper .hss th{background:var(--acc-soft,#eee)}
.paper .bank{margin-top:1.1em;font-size:.9em;line-height:1.4}
.paper .bank b{display:block;margin-bottom:1px;color:var(--acc,#16233f)}
.paper .sign{margin-top:1.2em;display:flex;justify-content:flex-end;break-inside:avoid}
.paper .sign>div{width:78mm;text-align:center;font-size:.93em}
.paper .sign img{max-height:calc(22mm*var(--k,1));max-width:70mm;display:block;margin:2px auto}
.paper .sign .line{border-top:1px solid #000;margin-top:3.4em;padding-top:.2em}
.paper .cert{margin-top:.8em;font-size:.9em;font-style:italic}
.paper .pgfoot{position:absolute;left:var(--pad,12mm);right:var(--pad,12mm);bottom:5mm;font-size:.74em;color:#777;border-top:1px solid #ddd;padding-top:2px;display:flex;justify-content:space-between}
.paper .wm{position:absolute;top:42%;left:0;right:0;text-align:center;font-size:92pt;font-weight:800;letter-spacing:6px;color:rgba(0,0,0,.055);transform:rotate(-28deg);pointer-events:none;z-index:0}
.paper.lblpage .lb{border:2.5px solid #000;height:calc(var(--ph,297mm)/2 - 24mm);margin-bottom:6mm;display:flex;align-items:center;justify-content:center;break-inside:avoid;page-break-inside:avoid}
.paper.lblpage .lb pre{font-family:Arial,sans-serif;font-weight:800;font-size:19pt;line-height:1.5;margin:0;text-align:left}
.paper.lblpage{padding-top:10mm}
@media print{.paper{margin:0;box-shadow:none;break-after:page;page-break-after:always}.paper:last-child{break-after:auto;page-break-after:auto}.paper .wm{position:fixed}}
`;
document.getElementById('paperCss').textContent = PAPER_CSS;

/* ========== Helpers ========== */
const $=(s,e=document)=>e.querySelector(s);
const $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?0:n};
const fmt=(n,d=2)=>num(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtP=n=>num(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4});
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const uid=()=>Math.random().toString(36).slice(2,9);
const pad2=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayISO=()=>isoOf(new Date());
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function dLong(iso){if(!iso)return '';const [y,m,d]=iso.split('-').map(Number);return `${ord(d)} ${MONTHS[m-1]} ${y}`}
function addDays(iso,n){if(!iso)return '';const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+num(n));return isoOf(d)}
function diffDays(a,b){return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5)}
function fiscal(iso){if(!iso)return null;const y=+iso.slice(0,4),m=+iso.slice(5,7);return m>=6?y:y-1}
const CUR={EUR:['€','EURO','CENTS'],USD:['$','U.S. DOLLARS','CENTS'],JPY:['¥','JAPANESE YEN',''],GBP:['£','POUNDS STERLING','PENCE'],CNY:['¥','CHINESE YUAN','FEN'],SGD:['S$','SINGAPORE DOLLARS','CENTS'],THB:['฿','THAI BAHT','SATANG'],IDR:['Rp','INDONESIAN RUPIAH','SEN']};
const sym=c=>(CUR[c]||[c])[0];
const ONES=['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN','ELEVEN','TWELVE','THIRTEEN','FOURTEEN','FIFTEEN','SIXTEEN','SEVENTEEN','EIGHTEEN','NINETEEN'];
const TENS=['','','TWENTY','THIRTY','FORTY','FIFTY','SIXTY','SEVENTY','EIGHTY','NINETY'];
function w999(n){let s='';if(n>=100){s+=ONES[Math.floor(n/100)]+' HUNDRED';n%=100;if(n)s+=' AND '}if(n>=20){s+=TENS[Math.floor(n/10)];if(n%10)s+='-'+ONES[n%10]}else if(n)s+=ONES[n];return s}
function words(n){n=Math.floor(n);if(n===0)return 'ZERO';const u=['',' THOUSAND',' MILLION',' BILLION'];const p=[];let i=0;while(n>0){const x=n%1000;if(x)p.unshift(w999(x)+u[i]);n=Math.floor(n/1000);i++}return p.join(' ')}
function amountWords(total,cur){const info=CUR[cur]||[cur,cur,'CENTS'];const whole=Math.floor(total+1e-9);const cents=Math.round((total-whole)*100);let s=`SAY ${info[1]} ${words(whole)}`;if(cents&&info[2])s+=` AND ${words(cents)} ${info[2]}`;return s+' ONLY.'}

function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function ref(path){const p=path.split('.');let o;if(p[0]==='cur'){o=cur();p.shift()}else o=S;while(p.length>1)o=o[p.shift()];return [o,p[0]]}

/* ========== Calculations ========== */
const lineAmt=it=>r2(num(it.qty)*num(it.price));
const caseVol=c=>Math.round(num(c.l)*num(c.w)*num(c.h)/1e6*1000)/1000;
function totals(sh){
  const qty=sh.items.reduce((a,i)=>a+num(i.qty),0);
  const sub=r2(sh.items.reduce((a,i)=>a+lineAmt(i),0));
  const adds=r2(sh.adds.reduce((a,x)=>a+num(x.amount),0));
  return {qty,sub,adds,total:r2(sub+adds),nw:sh.cases.reduce((a,c)=>a+num(c.nw),0),gw:sh.cases.reduce((a,c)=>a+num(c.gw),0),vol:Math.round(sh.cases.reduce((a,c)=>a+caseVol(c),0)*1000)/1000,cases:sh.cases.length};
}
const paidAmt=sh=>r2((sh.payments||[]).reduce((a,p)=>a+num(p.amount),0));
const balance=sh=>r2(totals(sh).total-paidAmt(sh));
const jpyOf=sh=>totals(sh).total*rate(sh.currency);
function payText(sh){if(sh.payText&&sh.payText.trim())return sh.payText.trim();
  switch(sh.payMethod){case 'adv':return 'T/T in advance (100% prior to shipment).';case 'lc':return 'By irrevocable L/C at sight.';case 'dp':return 'D/P at sight.';
   default:return `T/T remittance within ${sh.payDays} days after invoice date.`}}
const payLabel=sh=>({tt:'T/T REMITTANCE',adv:'T/T IN ADVANCE',lc:'L/C AT SIGHT',dp:'D/P',other:'AS AGREED'}[sh.payMethod]||'T/T REMITTANCE');
const dueDate=sh=>sh.payMethod==='tt'&&sh.date?addDays(sh.date,sh.payDays):'';
const ITERM={FOB:'F.O.B.',CIF:'C.I.F.',CFR:'C&F',FCA:'F.C.A.',EXW:'EX WORKS',FAS:'F.A.S.',CPT:'C.P.T.',CIP:'C.I.P.',DAP:'D.A.P.',DPU:'D.P.U.',DDP:'D.D.P.'};
function genMarks(sh){const c=S.settings.company;const name=(sh.cust.name||'').toUpperCase();
  const w=name.split(' ').filter(Boolean);const half=Math.ceil(w.length/2);const a=w.slice(0,half).join(' '),b=w.slice(half).join(' ');
  return [`TO ${a}`.trim(),(b+' '+(sh.cust.country||'').toUpperCase()).trim(),(sh.goodsTitle||'').toUpperCase(),`INVOICE NO.${sh.invoiceNo}`,c.name,sh.origin||'MADE IN JAPAN'].filter(Boolean).join('\n')}
function caseOf(it,sh){return sh.cases.find(c=>num(c.no)===num(it.cs))}
const effHS=(it,sh)=>String(it.hs||sh.hs||'').trim();
const hsUniq=sh=>[...new Set(sh.items.map(i=>effHS(i,sh)).filter(Boolean))];
const hsInfo=code=>S.hsList.find(h=>h.code===code);
function lastPrice(sh,it){let best=null;S.shipments.forEach(o=>{if(o.id===sh.id||o.cust.name!==sh.cust.name||!sh.cust.name)return;const m=o.items.find(x=>x.desc===it.desc);if(m&&num(m.price)&&(!best||o.date>best.d))best={d:o.date,p:num(m.price)}});return best}
function prodOf(desc){return S.products.find(p=>p.desc===desc)}

/* ========== Form helpers ========== */
function F(label,path,o={}){const v=getv(path);let h;
  if(o.area)h=`<textarea data-p="${path}" rows="${o.rows||2}" placeholder="${esc(o.ph||'')}">${esc(v)}</textarea>`;
  else if(o.opts)h=`<select data-p="${path}" ${o.re?'data-r="1"':''}>${o.opts.map(x=>{const [a,b]=Array.isArray(x)?x:[x,x];return `<option value="${esc(a)}" ${a==v?'selected':''}>${esc(b)}</option>`}).join('')}</select>`;
  else h=`<input data-p="${path}" type="${o.type||'text'}" value="${esc(v)}" ${o.n?'data-n="1" step="any"':''} ${o.list?`list="${o.list}"`:''} ${o.min!=null?`min="${o.min}" max="${o.max}"`:''} placeholder="${esc(o.ph||'')}">`;
  return `<label class="f ${o.cls||''}"><span>${t(label)}</span>${h}</label>`}
function C(label,path,re){return `<label class="chk"><input type="checkbox" data-p="${path}" ${re?'data-r="1"':''} ${getv(path)?'checked':''}><span>${t(label)}</span></label>`}

/* ---- Dashboard ---- */
const STATUS=['quote','order','production','shipped','paid'];
const STL={quote:'Quotation',order:'Order',production:'Production',shipped:'Shipped',paid:'Paid'};
const CHECKS=['Quotation sent','Customer PO received','Order confirmation sent','Proforma / advance payment','Production completed','Shipping inspection report (検査成績書)','Packing done','Booking with forwarder','Commercial invoice issued','Packing list issued','Shipping instruction sent','Export declaration / permit','Certificate of origin (if requested)','Non-Russian steel certificate (EU)','Insurance (if CIF/CIP)','B/L or sea waybill received','Shipping advice + docs sent to customer','Payment received'];
const progress=sh=>Math.round(CHECKS.filter(k=>sh.checks[k]).length/CHECKS.length*100);
function events(){const now=todayISO(),ev=[];
  S.shipments.forEach(s=>{if(s.status==='paid')return;
    if(s.etd&&s.status!=='shipped')ev.push({d:s.etd,k:'ETD',s});
    if(s.eta)ev.push({d:s.eta,k:'ETA',s});
    const du=dueDate(s);if(du&&['order','production','shipped'].includes(s.status)&&balance(s)>0)ev.push({d:du,k:'Payment due',s});
    if(s.lcExpiry)ev.push({d:s.lcExpiry,k:'L/C expiry',s})});
  return ev.sort((a,b)=>a.d<b.d?-1:1)}
function vDash(){
  const now=todayISO(),fy0=fiscal(now);
  const fys=[...new Set([fy0,...S.shipments.map(s=>fiscal(s.date)).filter(Boolean)])].sort((a,b)=>b-a);
  const fyData=S.shipments.filter(s=>s.status!=='quote'&&s.date).map(s=>fiscal(s.date));
  const fyDef=fyData.includes(fy0)?fy0:(fyData.length?Math.max(...fyData):fy0);
  const fy=fyView&&fys.includes(fyView)?fyView:fyDef;
  const mine=S.shipments.filter(s=>fiscal(s.date)===fy&&s.status!=='quote');
  const sales={};mine.forEach(s=>{sales[s.currency]=(sales[s.currency]||0)+totals(s).total});
  const open={};S.shipments.filter(s=>['order','production','shipped'].includes(s.status)).forEach(s=>{const b=balance(s);if(b>0)open[s.currency]=(open[s.currency]||0)+b});
  const money=o=>Object.keys(o).length?Object.entries(o).map(([c,v])=>`${sym(c)}${fmt(v,0)}`).join(' · '):'—';
  const ev=events();const late=ev.filter(e=>e.k==='Payment due'&&e.d<now);
  /* monthly chart */
  const mo=Array.from({length:12},(_,i)=>({l:MONTHS[(5+i)%12].slice(0,3),v:0}));
  mine.forEach(s=>{const m=+s.date.slice(5,7);mo[m>=6?m-6:m+6].v+=jpyOf(s)});
  const mx=Math.max(...mo.map(m=>m.v),1),W=620,H=170,bw=(W-30)/12;
  const svg=`<svg viewBox="0 0 ${W} ${H+24}" width="100%" role="img" aria-label="monthly sales">${mo.map((m,i)=>{const h=m.v/mx*(H-20);return `<rect x="${24+i*bw+5}" y="${H-h}" width="${bw-10}" height="${Math.max(h,m.v?2:0)}" rx="3" style="fill:var(--${i%2?'navy':'navy'})"/><text x="${24+i*bw+bw/2}" y="${H+16}" font-size="10.5" text-anchor="middle" style="fill:var(--mut)">${m.l}</text>${m.v?`<text x="${24+i*bw+bw/2}" y="${H-h-4}" font-size="9.5" text-anchor="middle" style="fill:var(--ink)">${fmt(m.v/1e6,1)}M</text>`:''}`}).join('')}<line x1="22" y1="${H}" x2="${W}" y2="${H}" style="stroke:var(--line)"/></svg>`;
  const byC={};mine.forEach(s=>{byC[s.cust.name||'—']=(byC[s.cust.name||'—']||0)+jpyOf(s)});
  const top=Object.entries(byC).sort((a,b)=>b[1]-a[1]).slice(0,5),tm=Math.max(...top.map(x=>x[1]),1);
  const q=filter.toLowerCase();
  const rows=S.shipments.filter(s=>!q||(s.invoiceNo+s.cust.name+s.custPO).toLowerCase().includes(q)).sort((a,b)=>(b.date||'')<(a.date||'')?-1:1);
  return `<h1>${t('Dashboard')}</h1><p class="sub">${t('Overview of all shipments')}</p>
  <div class="row" style="margin-bottom:14px"><button data-a="newShip">+ ${t('New')}</button><button class="ghost" data-a="cmd">🔍 ${t('Search everything')}</button><button class="ghost" data-a="ics">📅 ${t('Export calendar (.ics)')}</button>
   <span class="grow"></span><select style="width:auto" data-a-change="fy">${fys.map(y=>`<option value="${y}" ${y===fy?'selected':''}>FY${y} (Jun ${y} – May ${y+1})</option>`).join('')}</select></div>
  <div class="grid g4" style="margin-bottom:16px">
   <div class="card kpi"><small>${t('Shipments')}</small><b>${S.shipments.length}</b></div>
   <div class="card kpi"><small>${t('Sales this fiscal year')} · FY${fy}</small><b>${money(sales)}</b></div>
   <div class="card kpi"><small>${t('Outstanding (unpaid)')}</small><b>${money(open)}</b>${late.length?`<div class="note" style="color:var(--err)">⚠ ${late.length} ${t('Payment due')}</div>`:''}</div>
   <div class="card kpi"><small>${t('Next sailing')}</small><b>${(ev.find(e=>e.k==='ETD'&&e.d>=now)||{d:'—'}).d}</b></div>
  </div>
  <div class="gdash"><div class="card"><h2>${t('Monthly sales (≈ JPY at your rates)')} · FY${fy}</h2>${svg}</div>
   <div><div class="card"><h2>${t('Coming up')}</h2>${ev.slice(0,7).map(e=>{const dd=diffDays(e.d,now);return `<div class="ev ${dd<0&&e.k==='Payment due'?'late':''}"><span class="d">${e.d.slice(5)}</span><span class="k">${esc(e.k)}</span><span>${esc(e.s.invoiceNo)}</span><span class="grow"></span><span class="note">${dd<0?dd:'+'+dd}d</span></div>`}).join('')||`<div class="note">${t('Nothing scheduled')}</div>`}</div>
   <div class="card"><h2>${t('Top customers')}</h2>${top.map(([n,v])=>`<div class="hbar"><span>${esc(n)}</span><div class="bar"><i style="width:${v/tm*100}%"></i></div><em>¥${fmt(v/1e6,2)}M</em></div>`).join('')||'—'}</div></div></div>
  <div class="card"><div class="row" style="margin-bottom:10px"><input id="flt" style="max-width:280px" placeholder="${esc(tt('Search'))}" value="${esc(filter)}" data-a-input="flt"></div>
  <div style="overflow:auto"><table class="t"><thead><tr><th>${t('Invoice No.')}</th><th>${t('Customer')}</th><th>${t('Date')}</th><th>${t('Sailing')}</th><th class="r">${t('Total')}</th><th class="r">${t('Balance')}</th><th>${t('Status')}</th><th>${t('Progress')}</th><th>${t('Payment due')}</th></tr></thead><tbody>
  ${rows.map(s=>{const T=totals(s),due=dueDate(s),lt=due&&['order','production','shipped'].includes(s.status)&&due<now&&balance(s)>0;
   return `<tr class="click" data-a="open" data-id="${s.id}"><td><b>${esc(s.invoiceNo)}</b></td><td>${esc(s.cust.name)}</td><td>${esc(s.date)}</td><td>${esc(s.etd)}</td><td class="r">${sym(s.currency)} ${fmt(T.total)}</td><td class="r">${s.status==='paid'?'—':sym(s.currency)+' '+fmt(balance(s))}</td><td><span class="pill ${s.status}">${esc(tt(STL[s.status]))}</span></td><td><div class="bar"><i style="width:${progress(s)}%"></i></div></td><td style="${lt?'color:var(--err);font-weight:600':''}">${esc(due)}</td></tr>`}).join('')}
  </tbody></table></div></div>`;
}

function runChecks(sh){const r=[];const add=(l,m,...a)=>r.push({l,m,a});const T=totals(sh);
  [['invoiceNo','Invoice No.'],['date','Invoice date'],['cust.name','Company name'],['cust.addr','Address'],['pol','Port of loading'],['pod','Port of discharge'],['etd','Sailing on or about (ETD)'],['currency','Currency']].forEach(([k,lab])=>{const v=k.includes('.')?sh[k.split('.')[0]][k.split('.')[1]]:sh[k];if(!String(v||'').trim())add('err','Missing: {0}',tt(lab))});
  if(!sh.items.length)add('err','No line items.');
  sh.items.forEach((it,i)=>{if(!String(it.desc).trim())add('err','Line {0}: description is empty.',i+1);if(!num(it.qty)||!num(it.price))add('warn','Line {0}: quantity or unit price is zero.',i+1);
    if(sh.cases.length&&!caseOf(it,sh))add('err','Line {0} is not assigned to a valid case.',i+1)});
  if(!sh.cases.length)add('err','No cases defined in Packing tab.');
  sh.cases.forEach(c=>{if(!num(c.l)||!num(c.w)||!num(c.h))add('warn','Case {0}: dimensions missing.',c.no);if(num(c.gw)<num(c.nw))add('err','Case {0}: gross weight is lower than net weight.',c.no)});
  const hs=hsUniq(sh);if(!hs.length)add('warn','HS code is missing (needed for customs).');

  if(hs.length>1)add('info','Several HS codes in use ({0}): HS column and summary are printed.',hs.join(', '));
  if(!String(sh.custPO).trim())add('warn','Customer order number is empty.');
  if(sh.etd&&sh.date&&sh.etd<sh.date)add('warn','Sailing date is earlier than the invoice date.');
  if(S.shipments.some(s=>s.id!==sh.id&&s.invoiceNo===sh.invoiceNo))add('err','Invoice No. {0} is also used by another shipment.',sh.invoiceNo);
  if(['FOB','CIF','CFR','FAS','FCA','CPT','CIP','DAP','DPU','DDP'].includes(sh.incoterm)){if(!String(sh.incotermPlace).trim())add('err','Incoterm {0} needs a named place.',sh.incoterm);

  if(EU.includes((sh.cust.country||'').toUpperCase().trim())&&!sh.steelCert)add('info','Destination is in the EU: customers often ask for the non-Russian iron & steel statement.');
  const due=dueDate(sh);if(due){add('info','Payment due {0} ({1} days after invoice date).',due,sh.payDays);if(['order','production','shipped'].includes(sh.status)&&balance(sh)>0&&due<todayISO())add('err','Payment is overdue by {0} days.',diffDays(todayISO(),due))}
  if(['order','production','shipped'].includes(sh.status)&&balance(sh)>0&&T.total>0)add('info','Balance outstanding: {0}.',sym(sh.currency)+' '+fmt(balance(sh)));
  add('info','Weights: net {0} kg / gross {1} kg / {2} m³ across {3} case(s).',fmt(T.nw,1),fmt(T.gw,1),fmt(T.vol,3),T.cases);
  if(!r.some(x=>x.l==='err'||x.l==='warn'))r.unshift({l:'ok',m:'All checks passed. Documents are generated from one data source, so Invoice and Packing List always agree.',a:[]});
  return r}

function cmdItems(q){q=q.toLowerCase().trim();const out=[];
  NAV.forEach(([k,l])=>out.push({t:tt(l),s:tt('Go to'),f:()=>{view=k;render()}}));
  out.push({t:'+ '+tt('New'),s:tt('Shipment'),f:()=>A.newShip()});
  S.shipments.forEach(s=>out.push({t:`${s.invoiceNo} · ${s.cust.name}`,s:tt('Shipment'),f:()=>A.open({id:s.id})}));
  S.customers.forEach(c=>out.push({t:c.name,s:tt('Customers'),f:()=>{view='masters';mtab='cust';render()}}));
  S.products.forEach(p=>out.push({t:p.desc,s:tt('Products'),f:()=>{view='masters';mtab='prod';render()}}));
  S.hsList.forEach(h=>out.push({t:h.code+' '+h.en,s:'HS',f:()=>{view='masters';mtab='hs';render()}}));
  THEMES.forEach(h=>out.push({t:h[1],s:tt('Theme'),f:()=>{S.settings.theme=h[0];save();render()}}));
  DOCS.forEach(([k,l])=>out.push({t:tt(l),s:tt('Documents'),f:()=>{docTab=k;view='docs';render()}}));
  return out.filter(x=>!q||(x.t+' '+x.s).toLowerCase().includes(q)).slice(0,10)}
function cmdRender(){const q=$('#cmdIn').value;const it=cmdItems(q);cmdIdx=Math.min(cmdIdx,Math.max(it.length-1,0));
  $('#cmdList').innerHTML=it.map((x,i)=>`<div class="${i===cmdIdx?'on':''}" data-cmd="${i}"><span>${esc(x.t)}</span><small>${esc(x.s)}</small></div>`).join('')||'<div><small>—</small></div>';cmdRender.items=it}
function cmdOpen(){const d=$('#cmd');if(!d.open)d.showModal();$('#cmdIn').value='';cmdIdx=0;cmdRender();setTimeout(()=>$('#cmdIn').focus(),0)}
function cmdRun(i){const x=(cmdRender.items||[])[i];if(!x)return;$('#cmd').close();x.f()}

/* ========== Events ========== */
function refreshDerived(){const sh=cur();
  sh.items.forEach((it,i)=>{const e=$('#amt'+i);if(e)e.textContent=fmt(lineAmt(it));const m=$('#mg'+i);if(m){const rev=num(it.price)*rate(sh.currency);m.textContent=rev&&num(it.cost)?fmt((rev-num(it.cost))/rev*100,1)+'%':'—'}});
  sh.cases.forEach((c,i)=>{const e=$('#vol'+i);if(e)e.textContent=fmt(caseVol(c),3);const p=$('#cpcs'+i);if(p)p.textContent=fmt(sh.items.filter(it=>num(it.cs)===num(c.no)).reduce((a,it)=>a+num(it.qty),0),0)});
  const tb=$('#totbox');if(tb)tb.innerHTML=totBox();const pt=$('#packtot');if(pt)pt.innerHTML=packTot();
  if(view==='docs'&&$('#pv')){$('#pv').innerHTML=renderDoc(docTab);applyPage();fitPreview()}}
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='cmdIn'){cmdIdx=0;cmdRender();return}
  if(el.dataset.calc){calcTools();if(el.id==='pc_c'){$('#pc_r').value=S.rates[el.value];calcTools()}return}
  if(el.dataset.aInput==='flt'){filter=el.value;const pos=el.selectionStart;render();const f=$('#flt');f.focus();f.setSelectionRange(pos,pos);return}
  const p=el.dataset.p;if(!p||el.type==='checkbox'||el.type==='file')return;
  let v=el.value;if(el.dataset.n)v=v===''?'':parseFloat(v);setv(p,v);save();refreshDerived()});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.aChange==='selship'){S.cur=el.value;save();render();return}
  if(el.dataset.aChange==='fy'){fyView=+el.value;render();return}
  if(el.id==='fileIn'){doRestore(el.files[0]);el.value='';return}
  if(el.id==='sigIn'||el.id==='logoIn'){const f=el.files[0];if(!f)return;const isLogo=el.id==='logoIn';const rd=new FileReader();rd.onload=()=>{
      const img=new Image();img.onload=()=>{const k=Math.min(1,700/img.width);const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        S.settings[isLogo?'logo':'sigImg']=cv.toDataURL('image/png');save();render()};img.onerror=()=>{S.settings[isLogo?'logo':'sigImg']=rd.result;save();render()};img.src=rd.result};rd.readAsDataURL(f);return}
  if(el.dataset.chk){cur().checks[el.dataset.chk]=el.checked;save();render();return}
  const p=el.dataset.p;if(!p)return;
  if(el.type==='checkbox'){setv(p,el.checked);save();if(el.dataset.r)render();else refreshDerived();return}
  if(el.tagName==='SELECT')setv(p,el.dataset.n?parseFloat(el.value):el.value);
  if(el.dataset.desc){const i=+p.split('.')[2];const pr=prodOf(el.value);const it=cur().items[i];if(pr&&it){if(!num(it.price))it.price=pr.price;if(!num(it.cost))it.cost=pr.cost||0;if(!it.hs&&pr.hs&&pr.hs!==cur().hs)it.hs=pr.hs;if(pr.unit)it.unit=pr.unit;save();render();return}}
  if(el.dataset.r){save();render();return}
  if(p==='cur.invoiceNo'||p==='cur.cust.name'){save();renderChrome()}
  if(p.startsWith('cur.items.')&&p.endsWith('.hs')){save()}
});
function doBackup(){S.lastBackup=todayISO();save();const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`tsh-export-desk-${todayISO()}.json`;document.body.appendChild(a);a.click();a.remove();toast(tt('Backup'));renderChrome()}
function doRestore(f){if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.shipments||!o.settings)throw 0;S=migrate(o);save();render();toast(tt('Restored'))}catch(e){toast(tt('Invalid backup file'))}};rd.readAsText(f)}
function fitPapers(root,on,ph){if(!on)return;[].forEach.call(root.querySelectorAll('.paper:not(.lblpage)'),function(p){var k=parseFloat(getComputedStyle(p).getPropertyValue('--k'))||1,n=0;while(p.scrollHeight>ph+2&&k>0.68&&n<30){k=Math.round((k-0.02)*100)/100;p.style.setProperty('--k',k);n++}})}
const pagePx=()=>S.print.size==='Letter'?1056:1122;
function printDocs(list){const pa=$('#printArea');pa.innerHTML=list.map(renderDoc).join('');pa.style.cssText='display:block;position:absolute;left:-99999px;top:0';fitPapers(pa,S.print.fit,pagePx());pa.style.cssText='';try{window.print()}catch(e){toast(tt('Printing is blocked here. Use "Printable file".'))}}
function themeVars(){const cs=getComputedStyle(document.documentElement),n=cs.getPropertyValue('--navy').trim();return `:root{--acc:${n};--acc-soft:color-mix(in srgb,${n} 8%,#fff)}`}
function downloadPrintable(list){const l=S.print.size==='Letter';const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(cur().invoiceNo)}</title><style>${themeVars()}@page{size:${l?'letter':'A4'};margin:0}body{background:#e5e1d6;margin:0;padding:12px}${PAPER_CSS}@media print{body{background:#fff;padding:0}}</style></head><body>${list.map(renderDoc).join('')}<script>(${fitPapers.toString()})(document,${!!S.print.fit},${pagePx()})<\/script></body></html>`;
  const b=new Blob([html],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`${cur().invoiceNo}-documents.html`;document.body.appendChild(a);a.click();a.remove()}
function parsePaste(txt){const out=[];txt.split(/\r?\n/).forEach(line=>{if(!line.trim())return;let c=line.split('\t');if(c.length<2)c=line.split(/[;,](?=\s*[\d€$])/);c=c.map(x=>x.trim());
  if(c.length>=4&&/^\d+\.?$/.test(c[0]))c.shift();if(c.length<2)return;out.push({desc:c[0],qty:num(c[1]),price:num(c[2]||0),hs:c[3]||'',unit:'pcs',cost:0,cs:1})});return out}
function icsFor(list){const ev=[];const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  list.forEach(s=>[['ETD',s.etd],['ETA',s.eta],['Payment due',dueDate(s)]].forEach(([n,d])=>{if(!d)return;const a=d.replace(/-/g,''),b=addDays(d,1).replace(/-/g,'');
    ev.push(`BEGIN:VEVENT\r\nUID:${s.id}-${n.replace(/\s/g,'')}@tsh-export-desk\r\nDTSTAMP:${stamp}\r\nDTSTART;VALUE=DATE:${a}\r\nDTEND;VALUE=DATE:${b}\r\nSUMMARY:${n} ${s.invoiceNo} ${s.cust.name}\r\nEND:VEVENT`)}));
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//TSH Export Desk//EN\r\n${ev.join('\r\n')}\r\nEND:VCALENDAR`}
function dl(name,mime,data){const b=new Blob([data],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function ask(msg,fn){const d=$('#dlg');d.innerHTML=`<h2>${esc(msg)}</h2><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="ghost" data-a="dlgClose">${t('Cancel')}</button><button class="danger" id="askOk">OK</button></div>`;d.showModal();$('#askOk').onclick=()=>{d.close();fn()}}
const A={
 nav:d=>{view=d.v;render()},tab:d=>{tab=d.v;render()},doc:d=>{docTab=d.v;render()},mtab:d=>{mtab=d.v;render()},lang:d=>{S.lang=d.v;save();render()},
 theme:d=>{S.settings.theme=d.v;save();render()},cmd:()=>cmdOpen(),
 setStatus:d=>{cur().status=d.v;save();render()},
 open:d=>{S.cur=d.id;view='ship';tab='info';save();render()},
 newShip:()=>{const s=blankShipment();S.settings.nextNo=num(S.settings.nextNo)+1;S.shipments.push(s);S.cur=s.id;view='ship';tab='info';save();render()},
 dupShip:()=>{const s=JSON.parse(JSON.stringify(cur()));s.id=uid();s.invoiceNo=S.settings.prefix+S.settings.nextNo;S.settings.nextNo=num(S.settings.nextNo)+1;s.status='quote';s.checks={};s.payments=[];s.date=todayISO();s.marks=s.marks.replace(/INVOICE NO\.\S+/,'INVOICE NO.'+s.invoiceNo);S.shipments.push(s);S.cur=s.id;view='ship';save();render()},
 delShip:()=>{if(S.shipments.length<2)return;ask(tt('Delete this shipment?'),()=>{S.shipments=S.shipments.filter(s=>s.id!==cur().id);S.cur=S.shipments[0].id;view='dash';save();render()})},
 addItem:()=>{cur().items.push({desc:'',hs:'',qty:1,unit:'pcs',price:0,cost:0,cs:1});save();render()},
 delItem:d=>{cur().items.splice(+d.i,1);save();render()},
 dupItem:d=>{const a=cur().items;a.splice(+d.i+1,0,{...a[+d.i]});save();render()},
 mv:d=>{const a=cur().items,i=+d.i,j=i+ +d.d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()},
 addAdd:()=>{cur().adds.push({label:'',amount:0});save();render()},delAdd:d=>{cur().adds.splice(+d.i,1);save();render()},
 addPay:()=>{cur().payments.push({date:todayISO(),amount:0,ref:''});save();render()},delPay:d=>{cur().payments.splice(+d.i,1);save();render()},
 payFull:()=>{const sh=cur();sh.payments.push({date:todayISO(),amount:balance(sh),ref:'T/T'});save();render()},
 markPaid:()=>{const sh=cur();sh.status='paid';sh.checks['Payment received']=true;save();render()},
 addCase:()=>{const c=cur().cases;c.push({no:(c.length?Math.max(...c.map(x=>num(x.no))):0)+1,l:0,w:0,h:0,nw:0,gw:0});save();render()},
 delCase:d=>{cur().cases.splice(+d.i,1);save();render()},
 allCase1:()=>{cur().items.forEach(i=>i.cs=1);save();render()},
 nwCalc:()=>{const sh=cur();let any=false;sh.cases.forEach(c=>{let w=0;sh.items.forEach(it=>{if(num(it.cs)===num(c.no)){const p=prodOf(it.desc);if(p&&num(p.wt))w+=num(p.wt)*num(it.qty)}});if(w>0){c.nw=Math.round(w*10)/10;any=true}});save();render();if(any)toast(tt('Updated'))},
 genMarks:()=>{cur().marks=genMarks(cur());save();render()},
 loadCust:()=>{const id=$('#custPick').value;const c=S.customers.find(x=>x.id===id);if(!c)return;const sh=cur();sh.cust={name:c.name,country:c.country,addr:c.addr,attn:c.attn,tel:c.tel,fax:c.fax,email:c.email||'',vat:c.vat||''};
   if(c.currency)sh.currency=c.currency;if(c.incoterm)sh.incoterm=c.incoterm;if(c.payDays!=='')sh.payDays=c.payDays;if(c.pod){sh.pod=c.pod}if(!sh.finalDest)sh.finalDest=c.name;sh.steelCert=!!c.steel;if(c.remarks)sh.remarks=c.remarks;save();render()},
 pasteDlg:()=>{const d=$('#dlg');d.innerHTML=`<h2>${t('Paste from Excel')}</h2><p class="note">${esc(tt('Paste rows copied from Excel. Columns: Description, Qty, Unit price (optional: HS code).'))}</p><textarea id="pasteTx" rows="10" style="font-family:monospace"></textarea><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="ghost" data-a="dlgClose">${t('Cancel')}</button><button data-a="pasteGo">${t('Import')}</button></div>`;d.showModal()},
 dlgClose:()=>$('#dlg').close(),
 pasteGo:()=>{const rows=parsePaste($('#pasteTx').value);rows.forEach(r=>{const p=prodOf(r.desc);if(p){if(!r.price)r.price=p.price;r.cost=p.cost||0;if(!r.hs&&p.hs&&p.hs!==cur().hs)r.hs=p.hs}});cur().items.push(...rows);$('#dlg').close();save();render()},
 toMaster:()=>{let n=0;cur().items.forEach(i=>{if(i.desc.trim()&&!prodOf(i.desc)){S.products.push({id:uid(),desc:i.desc,hs:i.hs||cur().hs,unit:i.unit,price:i.price,cost:i.cost||0,wt:0});n++}});save();render();toast(tt('Added to product master')+' ('+n+')')},
 csv:()=>{const sh=cur();const rows=[['No','Description','HS','Qty','Unit','Unit price','Amount','Case'],...sh.items.map((i,k)=>[k+1,i.desc,effHS(i,sh),i.qty,i.unit,i.price,lineAmt(i),i.cs])];
   dl(sh.invoiceNo+'-items.csv','text/csv','﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n'))},
 ics:()=>dl('tsh-export-calendar.ics','text/calendar',icsFor(S.shipments.filter(s=>s.status!=='paid'))),
 addCust:()=>{S.customers.push({id:uid(),name:'',country:'',addr:'',attn:'',tel:'',fax:'',currency:'EUR',incoterm:'FOB',payDays:45,pod:'',steel:false,remarks:''});save();render()},
 delCust:d=>{S.customers.splice(+d.i,1);save();render()},
 addProd:()=>{S.products.push({id:uid(),desc:'',hs:'',unit:'pcs',price:0,cost:0,wt:0});save();render()},
 delProd:d=>{S.products.splice(+d.i,1);save();render()},
 addHS:()=>{S.hsList.push({code:'',en:'',ja:'',jp:'',note:''});save();render()},delHS:d=>{S.hsList.splice(+d.i,1);save();render()},
 printOne:()=>printDocs([docTab]),printAll:()=>printDocs(['ci','pl','si','cm']),
 dlPrintable:()=>downloadPrintable(['ci','pl','si','cm']),
 backup:doBackup,restore:()=>$('#fileIn').click(),
 reset:()=>ask(tt('Reset everything to sample data?'),()=>{const keep=S.settings.theme;S=seed();S.settings.theme=keep;save();view='dash';render()}),
 clean:()=>ask(tt('Remove all sample shipments, customers and products?'),()=>{const b=blankShipment();S.shipments=[b];S.cur=b.id;S.customers=[];S.products=[];S.settings.nextNo=num(S.settings.nextNo)+1;save();view='dash';render()}),
 copyBackup:()=>{const tx=document.createElement('textarea');tx.value=JSON.stringify(S);document.body.appendChild(tx);tx.select();try{document.execCommand('copy')}catch(e){}try{navigator.clipboard.writeText(tx.value)}catch(e){}tx.remove();toast(tt('Copied'))},
 rmSig:()=>{S.settings.sigImg='';save();render()},rmLogo:()=>{S.settings.logo='';save();render()},
 mail:d=>{$('#mailTx').value=mailText(d.v)},
 copyMail:()=>{const tx=$('#mailTx');tx.select();try{document.execCommand('copy')}catch(e){}try{navigator.clipboard.writeText(tx.value)}catch(e){}toast(tt('Copied'))}
};
document.addEventListener('click',e=>{
  const cm=e.target.closest('[data-cmd]');if(cm){cmdRun(+cm.dataset.cmd);return}
  const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;const f=A[b.dataset.a];if(f)f(b.dataset,b)});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();cmdOpen();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();doBackup();return}
  if(e.target.id==='cmdIn'){const n=(cmdRender.items||[]).length;
    if(e.key==='ArrowDown'){e.preventDefault();cmdIdx=(cmdIdx+1)%Math.max(n,1);cmdRender()}
    else if(e.key==='ArrowUp'){e.preventDefault();cmdIdx=(cmdIdx-1+n)%Math.max(n,1);cmdRender()}
    else if(e.key==='Enter'){e.preventDefault();cmdRun(cmdIdx)}}});
render();
</script>
</body>
</html>
