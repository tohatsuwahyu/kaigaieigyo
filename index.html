<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px #0001,0 6px 18px -12px #0003}

@media(max-width:900px){#app{flex-direction:column}#side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;gap:4px}.brand{border:0;padding:0;margin:0}.nav{display:flex;flex-wrap:wrap}.nav button{width:auto}.sidefoot{display:none}.g2,.g3,.g4{grid-template-columns:1fr}}

.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}

table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--w1)}
.kpi{border-left:3px solid var(--gold);margin:0}

.bar{height:6px;background:var(--w3);border-radius:9px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--gold)}
.hbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px}.hbar span{width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar .bar{flex:1;height:9px}.hbar em{font-style:normal;color:var(--mut);width:84px;text-align:right}
.chkrow{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid var(--w3)}

.msg{padding:9px 12px;border-radius:8px;margin-bottom:7px;font-size:13.5px;border-left:4px solid}

.ev{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--w3);font-size:13px}
.ev .d{width:56px;font-weight:600;color:var(--navy)}.ev .k{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--acc-soft);color:var(--navy)}
.ev.late .d,.ev.late{color:var(--err)}
.hint{font-size:10.5px;color:var(--mut);margin-top:1px}.hint.up{color:var(--err)}.hint.dn{color:var(--ok)}

.doclist .card{padding:12px 14px;margin:10px 0}
.doclist details summary{cursor:pointer;font-weight:600;color:var(--navy);margin-bottom:8px}
.doclist .grid{gap:8px}
.pvwrap{flex:1;min-width:0;overflow:auto;background:#d9d4c7;padding:20px;border-radius:12px}
.pv{width:fit-content;margin:0 auto}
@media(max-width:900px){.docs{flex-direction:column}.doclist{width:100%;position:static;max-height:none}}
textarea.mail{min-height:240px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.note{font-size:12px;color:var(--mut)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:96px;border:2px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;text-align:center;font-size:11.5px;background:#fff}
.sw i{display:block;height:26px;border-radius:6px;margin-bottom:4px}

dialog{border:0;border-radius:14px;padding:22px;width:min(640px,94vw);box-shadow:0 20px 60px #0006}

#cmd{padding:0;width:min(560px,94vw);margin-top:12vh}
#cmd input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:16px}

#toast.on{opacity:1}
#printArea{display:none}
@media print{#app,#toast,dialog{display:none!important}#printArea{display:block}body{background:#fff}}

<script>
/* Logo: replaced at build time with a data: URI of tsh.png (empty = look for tsh.png next to this file) */
const LOGO_DEFAULT = '';
/* Default backend (Google Apps Script web app). The URL alone is useless without the secret token. */
const DEFAULT_GAS = 'https://script.google.com/macros/s/AKfycbwq3p3eiZgWdsOMiAslLFmbrAKhQiuP-hiSoPzTukVxFnvxKh92ojVM30MogzR15-3S/exec';

/* ========== Paper (document) CSS – shared by screen preview, print and exported file ========== */
const PAPER_CSS = `
.paper{width:var(--pw,210mm);min-height:var(--ph,297mm);background:#fff;color:#000;padding:var(--pad,12mm);padding-bottom:calc(var(--pad,12mm) + 7mm);box-sizing:border-box;font-family:Arial,"Hiragino Sans","Yu Gothic",sans-serif;font-size:calc(9.2pt*var(--k,1));line-height:1.35;margin:0 auto 14px;box-shadow:0 2px 12px #0003;position:relative;overflow:hidden}
.paper table.sr{width:100%;border-collapse:collapse;font-size:.88em;margin:.3em 0 1em}.paper table.sr th{background:var(--acc-soft,#eef);text-align:left;padding:.35em .5em;border-bottom:1.5px solid var(--acc,#16233f);font-weight:700}.paper table.sr td{padding:.28em .5em;border-bottom:.5px solid #cfcfcf}.paper table.sr .r{text-align:right;white-space:nowrap}.paper table.sr tr.tot td{font-weight:700;border-top:1.5px solid #000;border-bottom:0}.paper h4.sr{margin:1.1em 0 .3em;color:var(--acc,#16233f);font-size:1.05em}.paper .srk{display:flex;gap:.8em;margin:.2em 0 .6em}.paper .srk div{flex:1;border:1px solid #ccc;padding:.5em .7em}.paper .srk small{display:block;color:#555;font-size:.8em}.paper .srk b{font-size:1.25em}
.paper small.ja{display:block;font-size:.76em;color:#555;font-weight:400;letter-spacing:0}
.paper .dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2.5px solid var(--acc,#16233f);padding-bottom:.75em;margin-bottom:1em}
.paper .hl{display:flex;gap:10px;align-items:center}
.paper .dlogo{display:block;width:auto;max-width:44mm;object-fit:contain}
.paper .cname{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:1.5em;color:var(--acc,#16233f);letter-spacing:.3px}
.paper .caddr{font-size:.84em;color:#333;margin-top:2px;max-width:104mm}
.paper .dtitle{font-family:Georgia,serif;font-weight:700;font-size:1.85em;color:var(--acc,#16233f);text-align:right;letter-spacing:1px;white-space:nowrap}
.paper .dtitle small.ja{text-align:right;font-family:Arial,"Hiragino Sans",sans-serif;font-size:.45em}
.paper .ctag{display:inline-block;margin-top:3px;border:1px solid var(--acc,#16233f);color:var(--acc,#16233f);font-size:.72em;font-weight:700;letter-spacing:2px;padding:0 6px}
.paper .two{display:grid;grid-template-columns:1.1fr 1fr;border:1px solid #222;margin-bottom:.65em}
.paper .two>div{padding:.55em .8em}
.paper .two>div+div{border-left:1px solid #222}
.paper .lbl{font-size:.8em;color:#444}
.paper .val{font-weight:700;white-space:pre-line}
.paper .kv{display:grid;grid-template-columns:10.5em 1fr;gap:.2em .65em;margin:0}
.paper .ship{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid #222;margin-bottom:.65em}
.paper .ship>div{padding:.45em .8em;border-right:1px solid #222}.paper .ship>div:last-child{border-right:0}
.paper .ship>div:nth-child(n+4){border-top:1px solid #222}
.paper table.it{width:100%;border-collapse:collapse;border:1px solid #222}
.paper table.it thead{display:table-header-group}
.paper table.it tr{break-inside:avoid;page-break-inside:avoid}
.paper table.it th{background:var(--acc-soft,#eef0f5);font-size:.85em;border:1px solid #222;padding:.35em .45em;text-align:center}
.paper table.it td{padding:.27em .55em;border-left:1px solid #222;border-right:1px solid #222;vertical-align:top}
.paper.compact table.it td{padding:.08em .45em}
.paper table.it tr.last td{border-bottom:1px solid #222}
.paper table.it td.r{text-align:right;white-space:nowrap}.paper table.it td.c{text-align:center}
.paper table.it td.mk{font-size:.83em;font-weight:700;white-space:pre-line;vertical-align:top;line-height:1.5}
.paper table.it tr.tot td{border-top:1.5px solid #222;border-bottom:1.5px solid #222;font-weight:700;background:var(--acc-soft,#f4f4f4)}
.paper .sec{border:1px solid #222;border-top:0;padding:.55em .8em}
.paper .words{font-weight:700;font-size:.9em;margin-top:2px}
.paper .hss{margin-top:.9em;font-size:.88em}
.paper .hss table{border-collapse:collapse;width:100%}.paper .hss th,.paper .hss td{border:1px solid #888;padding:1px 5px;text-align:left}.paper .hss th{background:var(--acc-soft,#eee)}
.paper .bank{margin-top:1.1em;font-size:.9em;line-height:1.4}
.paper .bank b{display:block;margin-bottom:1px;color:var(--acc,#16233f)}
.paper .sign{margin-top:1.2em;display:flex;justify-content:flex-end;break-inside:avoid}
.paper .sign>div{width:78mm;text-align:center;font-size:.93em}
.paper .sign img{max-height:calc(22mm*var(--k,1));max-width:70mm;display:block;margin:2px auto}
.paper .sign .line{border-top:1px solid #000;margin-top:3.4em;padding-top:.2em}
.paper .cert{margin-top:.8em;font-size:.9em;font-style:italic}
.paper .pgfoot{position:absolute;left:var(--pad,12mm);right:var(--pad,12mm);bottom:5mm;font-size:.74em;color:#777;border-top:1px solid #ddd;padding-top:2px;display:flex;justify-content:space-between}
.paper .wm{position:absolute;top:42%;left:0;right:0;text-align:center;font-size:92pt;font-weight:800;letter-spacing:6px;color:rgba(0,0,0,.055);transform:rotate(-28deg);pointer-events:none;z-index:0}
.paper.lblpage .lb{border:2.5px solid #000;height:calc(var(--ph,297mm)/2 - 24mm);margin-bottom:6mm;display:flex;align-items:center;justify-content:center;break-inside:avoid;page-break-inside:avoid}
.paper.lblpage .lb pre{font-family:Arial,sans-serif;font-weight:800;font-size:19pt;line-height:1.5;margin:0;text-align:left}
.paper.lblpage{padding-top:10mm}
@media print{.paper{margin:0;box-shadow:none;break-after:page;page-break-after:always}.paper:last-child{break-after:auto;page-break-after:auto}.paper .wm{position:fixed}}

/* ========== Helpers ========== */
const $=(s,e=document)=>e.querySelector(s);
const $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?0:n};
const fmt=(n,d=2)=>num(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtP=n=>num(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4});
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const uid=()=>Math.random().toString(36).slice(2,9);
const pad2=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayISO=()=>isoOf(new Date());
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function dLong(iso){if(!iso)return '';const [y,m,d]=iso.split('-').map(Number);return `${ord(d)} ${MONTHS[m-1]} ${y}`}
function addDays(iso,n){if(!iso)return '';const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+num(n));return isoOf(d)}
function diffDays(a,b){return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5)}
function fiscal(iso){if(!iso)return null;const y=+iso.slice(0,4),m=+iso.slice(5,7);return m>=6?y:y-1}
const CUR={EUR:['€','EURO','CENTS'],USD:['$','U.S. DOLLARS','CENTS'],JPY:['¥','JAPANESE YEN',''],GBP:['£','POUNDS STERLING','PENCE'],CNY:['¥','CHINESE YUAN','FEN'],SGD:['S$','SINGAPORE DOLLARS','CENTS'],THB:['฿','THAI BAHT','SATANG'],IDR:['Rp','INDONESIAN RUPIAH','SEN']};
const sym=c=>(CUR[c]||[c])[0];
const ONES=['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN','ELEVEN','TWELVE','THIRTEEN','FOURTEEN','FIFTEEN','SIXTEEN','SEVENTEEN','EIGHTEEN','NINETEEN'];
const TENS=['','','TWENTY','THIRTY','FORTY','FIFTY','SIXTY','SEVENTY','EIGHTY','NINETY'];
function w999(n){let s='';if(n>=100){s+=ONES[Math.floor(n/100)]+' HUNDRED';n%=100;if(n)s+=' AND '}if(n>=20){s+=TENS[Math.floor(n/10)];if(n%10)s+='-'+ONES[n%10]}else if(n)s+=ONES[n];return s}
function words(n){n=Math.floor(n);if(n===0)return 'ZERO';const u=['',' THOUSAND',' MILLION',' BILLION'];const p=[];let i=0;while(n>0){const x=n%1000;if(x)p.unshift(w999(x)+u[i]);n=Math.floor(n/1000);i++}return p.join(' ')}
function amountWords(total,cur){const info=CUR[cur]||[cur,cur,'CENTS'];const whole=Math.floor(total+1e-9);const cents=Math.round((total-whole)*100);let s=`SAY ${info[1]} ${words(whole)}`;if(cents&&info[2])s+=` AND ${words(cents)} ${info[2]}`;return s+' ONLY.'}
const rate=c=>c==='JPY'?1:(S.rates[c]||0);

/* ---- Dashboard ---- */
const STATUS=['quote','order','production','shipped','paid'];
const STL={quote:'Quotation',order:'Order',production:'Production',shipped:'Shipped',paid:'Paid'};
const CHECKS=['Quotation sent','Customer PO received','Order confirmation sent','Proforma / advance payment','Production completed','Shipping inspection report (検査成績書)','Packing done','Booking with forwarder','Commercial invoice issued','Packing list issued','Shipping instruction sent','Export declaration / permit','Certificate of origin (if requested)','Non-Russian steel certificate (EU)','Insurance (if CIF/CIP)','B/L or sea waybill received','Shipping advice + docs sent to customer','Payment received'];
const progress=sh=>Math.round(CHECKS.filter(k=>sh.checks[k]).length/CHECKS.length*100);
function events(){const now=todayISO(),ev=[];
  S.shipments.forEach(s=>{if(s.status==='paid')return;
    if(s.etd&&s.status!=='shipped')ev.push({d:s.etd,k:'ETD',s});
    if(s.eta)ev.push({d:s.eta,k:'ETA',s});
    const du=dueDate(s);if(du&&['order','production','shipped'].includes(s.status)&&balance(s)>0)ev.push({d:du,k:'Payment due',s});
    if(s.lcExpiry)ev.push({d:s.lcExpiry,k:'L/C expiry',s})});
  return ev.sort((a,b)=>a.d<b.d?-1:1)}
function vDash(){
  const now=todayISO(),fy0=fiscal(now);
  const fys=[...new Set([fy0,...S.shipments.map(s=>fiscal(s.date)).filter(Boolean)])].sort((a,b)=>b-a);
  const fyData=S.shipments.filter(s=>s.status!=='quote'&&s.date).map(s=>fiscal(s.date));
  const fyDef=fyData.includes(fy0)?fy0:(fyData.length?Math.max(...fyData):fy0);
  const fy=fyView&&fys.includes(fyView)?fyView:fyDef;repFY=fy;
  const mine=S.shipments.filter(s=>fiscal(s.date)===fy&&s.status!=='quote');
  const sales={};mine.forEach(s=>{sales[s.currency]=(sales[s.currency]||0)+totals(s).total});
  const open={};S.shipments.filter(s=>['order','production','shipped'].includes(s.status)).forEach(s=>{const b=balance(s);if(b>0)open[s.currency]=(open[s.currency]||0)+b});
  const money=o=>Object.keys(o).length?Object.entries(o).map(([c,v])=>`${sym(c)}${fmt(v,0)}`).join(' · '):'—';
  const ev=events();const late=ev.filter(e=>e.k==='Payment due'&&e.d<now);
  /* monthly chart */
  const mo=Array.from({length:12},(_,i)=>({l:MONTHS[(5+i)%12].slice(0,3),v:0}));
  mine.forEach(s=>{const m=+s.date.slice(5,7);mo[m>=6?m-6:m+6].v+=jpyOf(s)});
  const mx=Math.max(...mo.map(m=>m.v),1),W=620,H=170,bw=(W-30)/12;
  const svg=`<svg viewBox="0 0 ${W} ${H+24}" width="100%" role="img" aria-label="monthly sales">${mo.map((m,i)=>{const h=m.v/mx*(H-20);return `<rect x="${24+i*bw+5}" y="${H-h}" width="${bw-10}" height="${Math.max(h,m.v?2:0)}" rx="3" style="fill:var(--${i%2?'navy':'navy'})"/><text x="${24+i*bw+bw/2}" y="${H+16}" font-size="10.5" text-anchor="middle" style="fill:var(--mut)">${m.l}</text>${m.v?`<text x="${24+i*bw+bw/2}" y="${H-h-4}" font-size="9.5" text-anchor="middle" style="fill:var(--ink)">${fmt(m.v/1e6,1)}M</text>`:''}`}).join('')}<line x1="22" y1="${H}" x2="${W}" y2="${H}" style="stroke:var(--line)"/></svg>`;
  const byC={};mine.forEach(s=>{byC[s.cust.name||'—']=(byC[s.cust.name||'—']||0)+jpyOf(s)});
  const top=Object.entries(byC).sort((a,b)=>b[1]-a[1]).slice(0,5),tm=Math.max(...top.map(x=>x[1]),1);
  const q=filter.toLowerCase();
  const rows=S.shipments.filter(s=>!q||(s.invoiceNo+s.cust.name+s.custPO).toLowerCase().includes(q)).sort((a,b)=>(b.date||'')<(a.date||'')?-1:1);
  return `<h1>${t('Dashboard')}</h1><p class="sub">${t('Overview of all shipments')}</p>
  <div class="row" style="margin-bottom:14px"><button data-a="newShip">+ ${t('New')}</button><button class="ghost" data-a="poNew">${t('PO received')}</button><button class="ghost" data-a="cmd">${t('Search everything')}</button><button class="ghost" data-a="ics">${t('Export calendar (.ics)')}</button>
   <span class="grow"></span><select style="width:auto" data-a-change="fy">${fys.map(y=>`<option value="${y}" ${y===fy?'selected':''}>FY${y} (Jun ${y} – May ${y+1})</option>`).join('')}</select></div>
  ${(()=>{const rl=remList();return rl.length?`<div class="card"><h2>${t('Reminders')} · ${rl.length}</h2>${rl.slice(0,8).map(r=>`<div class="rem ${r.lvl}" data-a="open" data-id="${r.id}"><i></i><b>${esc(r.who)}</b><span>${esc(r.msg)}</span></div>`).join('')}</div>`:''})()}
  <div class="grid g4" style="margin-bottom:16px">
   <div class="card kpi"><small>${t('Shipments')}</small><b>${S.shipments.length}</b></div>
   <div class="card kpi"><small>${t('Sales this fiscal year')} · FY${fy}</small><b>${money(sales)}</b>${(()=>{const a=salesData(fy).total,b=salesData(fy-1).total;return b?`<div class="note">vs FY${fy-1}: ${(a>=b?'+':'')+fmt((a-b)/b*100,1)}%</div>`:''})()}</div>
   <div class="card kpi"><small>${t('Outstanding (unpaid)')}</small><b>${money(open)}</b>${late.length?`<div class="note" style="color:var(--err)">⚠ ${late.length} ${t('Payment due')}</div>`:''}</div>
   <div class="card kpi"><small>${t('Next sailing')}</small><b>${(ev.find(e=>e.k==='ETD'&&e.d>=now)||{d:'—'}).d}</b></div>
  </div>
  <div class="gdash"><div class="card"><div class="row" style="justify-content:space-between"><h2>${t('Monthly sales (≈ JPY at your rates)')} · FY${fy}</h2><div class="row"><button class="ghost sm" data-a="srPrint">${t('Print report')}</button><button class="ghost sm" data-a="srFile">${t('Report file')}</button><button class="ghost sm" data-a="srCsv">CSV</button></div></div>${svg}</div>
   <div><div class="card"><h2>${t('Coming up')}</h2>${ev.slice(0,7).map(e=>{const dd=diffDays(e.d,now);return `<div class="ev ${dd<0&&e.k==='Payment due'?'late':''}"><span class="d">${e.d.slice(5)}</span><span class="k">${esc(e.k)}</span><span>${esc(e.s.invoiceNo)}</span><span class="grow"></span><span class="note">${dd<0?dd:'+'+dd}d</span></div>`}).join('')||`<div class="note">${t('Nothing scheduled')}</div>`}</div>
   <div class="card"><h2>${t('Top customers')}</h2>${top.map(([n,v])=>`<div class="hbar"><span>${esc(n)}</span><div class="bar"><i style="width:${v/tm*100}%"></i></div><em>¥${fmt(v/1e6,2)}M</em></div>`).join('')||'—'}</div></div></div>
  <div class="card"><div class="row" style="margin-bottom:10px"><input id="flt" style="max-width:280px" placeholder="${esc(tt('Search'))}" value="${esc(filter)}" data-a-input="flt"></div>
  <div style="overflow:auto"><table class="t"><thead><tr><th>${t('Invoice No.')}</th><th>${t('Customer')}</th><th>${t('Date')}</th><th>${t('Sailing')}</th><th class="r">${t('Total')}</th><th class="r">${t('Balance')}</th><th>${t('Status')}</th><th>${t('Progress')}</th><th>${t('Payment due')}</th></tr></thead><tbody>
  ${rows.map(s=>{const T=totals(s),due=dueDate(s),lt=due&&['order','production','shipped'].includes(s.status)&&due<now&&balance(s)>0;
   return `<tr class="click" data-a="open" data-id="${s.id}"><td><b>${esc(s.invoiceNo)}</b></td><td>${esc(s.cust.name)}</td><td>${esc(s.date)}</td><td>${esc(s.etd)}</td><td class="r">${sym(s.currency)} ${fmt(T.total)}</td><td class="r">${s.status==='paid'?'—':sym(s.currency)+' '+fmt(balance(s))}</td><td><span class="pill ${s.status}">${esc(tt(STL[s.status]))}</span></td><td><div class="bar"><i style="width:${progress(s)}%"></i></div></td><td style="${lt?'color:var(--err);font-weight:600':''}">${esc(due)}</td></tr>`}).join('')}
  </tbody></table></div></div>`;
}

/* ---- Shipment ---- */
function vShip(){
  const tabs=[['info','Info'],['items','Items'],['pack','Packing'],['pay','Payments'],['chk','Checklist'],['verify','Check']];const sh=cur();const si=STATUS.indexOf(sh.status);
  return `<h1>${t('Shipment')} · ${esc(sh.invoiceNo)}</h1><p class="sub">${esc(sh.cust.name)}</p>
  ${nextStep(sh)}
  <div class="steps">${STATUS.map((s,i)=>`<button data-a="setStatus" data-v="${s}" class="${i<si?'done':''} ${i===si?'on':''}">${esc(tt(STL[s]))}</button>`).join('')}</div>
  <div class="tabs">${tabs.map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${tab===k?'on':''}">${t(l)}</button>`).join('')}</div>
  ${({info:tInfo,items:tItems,pack:tPack,pay:tPay,chk:tChk,verify:tVerify})[tab]()}`;
}
function nextStep(sh){
  const m={quote:['Waiting for the customer\'s order. When the PO arrives, register it here.','PO received','poFor'],
   order:['PO registered. Send the Order Confirmation to the customer, then start production.','Open Order Confirmation','goDoc:oc'],
   production:['In production. When the goods are ready, enter the cases and prepare the shipping documents.','Open Packing List','goDoc:pl'],
   shipped:['Shipped. Send the Commercial Invoice and watch for payment.','Open Commercial Invoice','goDoc:ci'],
   paid:['Payment received. This shipment is complete.','','']}[sh.status];
  const nx=STATUS[STATUS.indexOf(sh.status)+1];
  const [a,v]=(m[2]||'').split(':');
  return `<div class="next"><div><b>${esc(tt('Next step'))}</b><span>${esc(tt(m[0]))}</span></div><div class="row">${m[1]?`<button data-a="${a}" data-v="${v||''}">${esc(tt(m[1]))}</button>`:''}${nx?`<button class="ghost" data-a="advance">${esc(tt('Mark as'))} ${esc(tt(STL[nx]))}</button>`:''}</div></div>`}
function incoHint(sh){const r=INC.find(x=>x[0]===sh.incoterm);return r?`${r[0]} ${r[1]} — ${r[3]} · ${tt('Export clearance')}: ${r[4]} · ${tt('Main carriage')}: ${r[5]}`:''}

   <div style="margin-top:12px">${C('Consignee same as customer','cur.consigneeSame',1)}</div>

function itemRows(sh){const cost=S.ui.cost,rt=rate(sh.currency);return sh.items.map((it,i)=>{
  const lp=lastPrice(sh,it);let hint='';if(lp&&num(it.price)&&Math.abs(lp.p-num(it.price))>1e-9){const pc=(num(it.price)/lp.p-1)*100;hint=`<div class="hint ${pc>0?'dn':'up'}" title="${esc(lp.d)}: ${lp.p}">${esc(tt('vs last order {0}').replace('{0}',(pc>0?'+':'')+fmt(pc,1)+'%'))}</div>`}
  const rev=num(it.price)*rt,mg=rev&&num(it.cost)?(rev-num(it.cost))/rev*100:null;
  return `<tr>
  <td style="width:30px;text-align:center;color:var(--mut)">${i+1}</td>
  <td><input data-p="cur.items.${i}.desc" data-desc="1" list="prodList" value="${esc(it.desc)}"></td>
  <td style="width:96px"><input data-p="cur.items.${i}.hs" list="hsDl" value="${esc(it.hs)}" placeholder="${esc(sh.hs)}"></td>
  <td style="width:80px"><input data-p="cur.items.${i}.qty" type="number" step="any" data-n="1" value="${esc(it.qty)}"></td>
  <td style="width:62px"><input data-p="cur.items.${i}.unit" value="${esc(it.unit)}"></td>
  <td style="width:104px"><input data-p="cur.items.${i}.price" type="number" step="any" data-n="1" value="${esc(it.price)}">${hint}</td>
  <td class="r" style="width:100px" id="amt${i}">${fmt(lineAmt(it))}</td>
  ${cost?`<td style="width:92px"><input data-p="cur.items.${i}.cost" type="number" step="any" data-n="1" value="${esc(it.cost)}"></td><td class="r" style="width:64px" id="mg${i}">${mg==null?'—':fmt(mg,1)+'%'}</td>`:''}
  <td style="width:56px"><input data-p="cur.items.${i}.cs" type="number" data-n="1" value="${esc(it.cs)}"></td>
  <td style="white-space:nowrap"><button class="ghost sm" data-a="mv" data-i="${i}" data-d="-1">↑</button> <button class="ghost sm" data-a="mv" data-i="${i}" data-d="1">↓</button> <button class="ghost sm" data-a="dupItem" data-i="${i}">⧉</button> <button class="danger sm" data-a="delItem" data-i="${i}">✕</button></td></tr>`}).join('')}
function totBox(){const sh=cur(),T=totals(sh),s=sym(sh.currency),rt=rate(sh.currency);
  let h=`<div><small>${t('Total pcs')}</small><b>${fmt(T.qty,0)}</b></div><div><small>${t('Subtotal')}</small><b>${s} ${fmt(T.sub)}</b></div><div><small>${t('Total')}</small><b>${s} ${fmt(T.total)}</b>${sh.currency!=='JPY'&&rt?`<small>≈ ¥${fmt(T.total*rt,0)}</small>`:''}</div>`;
  if(S.ui.cost){const revJ=T.total*rt;let cost=0,miss=0;sh.items.forEach(i=>{cost+=num(i.cost)*num(i.qty);if(!num(i.cost))miss++});cost+=0;const gp=revJ-cost;
    h+=`<div><small>${t('Cost (JPY total)')}</small><b>¥${fmt(cost,0)}</b></div><div><small>${t('Gross profit (JPY)')}</small><b>¥${fmt(gp,0)}</b><small>${revJ?fmt(gp/revJ*100,1):0}%${miss?' · '+esc(tt('Items without cost: {0}').replace('{0}',miss)):''}</small></div>`}
  return h}
function packTot(){const T=totals(cur());return `<div><small>${t('Net wt')}</small><b>${fmt(T.nw,1)} kg</b></div><div><small>${t('Gross wt')}</small><b>${fmt(T.gw,1)} kg</b></div><div><small>${t('Volume')}</small><b>${fmt(T.vol,3)} m³</b></div>`}

function tPay(){const sh=cur(),T=totals(sh),s=sym(sh.currency),bal=balance(sh),du=dueDate(sh);
  return `<div class="card"><h2>${t('Payment tracker')}</h2>
  <div class="grid g4" style="margin-bottom:12px"><div class="kpi card"><small>${t('Invoice total')}</small><b>${s} ${fmt(T.total)}</b></div><div class="kpi card"><small>${t('Received')}</small><b>${s} ${fmt(paidAmt(sh))}</b></div><div class="kpi card"><small>${t('Balance')}</small><b>${s} ${fmt(bal)}</b></div><div class="kpi card"><small>${t('Payment due')}</small><b>${esc(du||'—')}</b></div></div>
  ${sh.payments.map((p,i)=>`<div class="row" style="margin-bottom:6px"><input type="date" style="max-width:160px" data-p="cur.payments.${i}.date" value="${esc(p.date)}"><input type="number" step="any" data-n="1" style="max-width:150px" data-p="cur.payments.${i}.amount" value="${esc(p.amount)}"><input style="max-width:260px" placeholder="${esc(tt('Reference'))}" data-p="cur.payments.${i}.ref" value="${esc(p.ref)}"><button class="danger sm" data-a="delPay" data-i="${i}">✕</button></div>`).join('')}
  <div class="row"><button class="ghost" data-a="addPay">+ ${t('Add payment')}</button>${bal>0?`<button class="ghost" data-a="payFull">${t('Record full balance today')}</button>`:''}${bal<=0&&T.total>0&&sh.status!=='paid'?`<button class="gold" data-a="markPaid">${t('Mark shipment as paid')}</button>`:''}</div></div>`}
function tChk(){const sh=cur();const p=progress(sh);
  return `<div class="card"><h2>${t('Document checklist')} · ${p}%</h2><div class="bar" style="height:9px;margin-bottom:10px"><i style="width:${p}%"></i></div>
  ${CHECKS.map(k=>`<div class="chkrow ${sh.checks[k]?'done':''}"><label class="chk"><input type="checkbox" data-chk="${esc(k)}" ${sh.checks[k]?'checked':''}><span>${t(k)}</span></label></div>`).join('')}</div>`}
const EU=['AUSTRIA','BELGIUM','BULGARIA','CROATIA','CYPRUS','CZECHIA','CZECH REPUBLIC','DENMARK','ESTONIA','FINLAND','FRANCE','GERMANY','GREECE','HUNGARY','IRELAND','ITALY','LATVIA','LITHUANIA','LUXEMBOURG','MALTA','NETHERLANDS','POLAND','PORTUGAL','ROMANIA','SLOVAKIA','SLOVENIA','SPAIN','SWEDEN'];
function runChecks(sh){const r=[];const add=(l,m,...a)=>r.push({l,m,a});const T=totals(sh);
  [['invoiceNo','Invoice No.'],['date','Invoice date'],['cust.name','Company name'],['cust.addr','Address'],['pol','Port of loading'],['pod','Port of discharge'],['etd','Sailing on or about (ETD)'],['currency','Currency']].forEach(([k,lab])=>{const v=k.includes('.')?sh[k.split('.')[0]][k.split('.')[1]]:sh[k];if(!String(v||'').trim())add('err','Missing: {0}',tt(lab))});
  if(!sh.items.length)add('err','No line items.');
  sh.items.forEach((it,i)=>{if(!String(it.desc).trim())add('err','Line {0}: description is empty.',i+1);if(!num(it.qty)||!num(it.price))add('warn','Line {0}: quantity or unit price is zero.',i+1);
    if(sh.cases.length&&!caseOf(it,sh))add('err','Line {0} is not assigned to a valid case.',i+1);
    const lp=lastPrice(sh,it);if(lp&&num(it.price)&&Math.abs(num(it.price)-lp.p)/lp.p>0.005){const dv=(num(it.price)-lp.p)/lp.p*100;add(Math.abs(dv)>=10?'warn':'info','Line {0}: price {1} differs from the last order ({2}, {3}).',i+1,fmt(num(it.price)),fmt(lp.p),lp.d)}});
  if(!sh.cases.length)add('err','No cases defined in Packing tab.');
  sh.cases.forEach(c=>{if(!num(c.l)||!num(c.w)||!num(c.h))add('warn','Case {0}: dimensions missing.',c.no);if(num(c.gw)<num(c.nw))add('err','Case {0}: gross weight is lower than net weight.',c.no)});
  const hs=hsUniq(sh);if(!hs.length)add('warn','HS code is missing (needed for customs).');
  hs.forEach(h=>{if(!/^\d{4}(\.\d{2}){1,3}$/.test(h))add('warn','HS code "{0}" has an unusual format (expected like 8207.20).',h)});
  if(hs.length>1)add('info','Several HS codes in use ({0}): HS column and summary are printed.',hs.join(', '));
  if(!String(sh.custPO).trim())add('warn','Customer order number is empty.');
  if(sh.etd&&sh.date&&sh.etd<sh.date)add('warn','Sailing date is earlier than the invoice date.');
  if(S.shipments.some(s=>s.id!==sh.id&&s.invoiceNo===sh.invoiceNo))add('err','Invoice No. {0} is also used by another shipment.',sh.invoiceNo);
  if(['FOB','CIF','CFR','FAS','FCA','CPT','CIP','DAP','DPU','DDP'].includes(sh.incoterm)){if(!String(sh.incotermPlace).trim())add('err','Incoterm {0} needs a named place.',sh.incoterm);
    else if(['FOB','CIF','CFR','FAS'].includes(sh.incoterm)&&sh.pol&&!sh.pol.toUpperCase().includes(sh.incotermPlace.toUpperCase().trim()))add('warn','Port of loading ({0}) differs from the Incoterm place ({1}). Make sure all documents agree.',sh.pol,sh.incotermPlace)}
  if(EU.includes((sh.cust.country||'').toUpperCase().trim())&&!sh.steelCert)add('info','Destination is in the EU: customers often ask for the non-Russian iron & steel statement.');
  const due=dueDate(sh);if(due){add('info','Payment due {0} ({1} days after invoice date).',due,sh.payDays);if(['order','production','shipped'].includes(sh.status)&&balance(sh)>0&&due<todayISO())add('err','Payment is overdue by {0} days.',diffDays(todayISO(),due))}
  if(['order','production','shipped'].includes(sh.status)&&balance(sh)>0&&T.total>0)add('info','Balance outstanding: {0}.',sym(sh.currency)+' '+fmt(balance(sh)));
  add('info','Weights: net {0} kg / gross {1} kg / {2} m³ across {3} case(s).',fmt(T.nw,1),fmt(T.gw,1),fmt(T.vol,3),T.cases);
  if(!r.some(x=>x.l==='err'||x.l==='warn'))r.unshift({l:'ok',m:'All checks passed. Documents are generated from one data source, so Invoice and Packing List always agree.',a:[]});
  return r}
function tVerify(){const r=runChecks(cur());const ord={err:0,warn:1,ok:2,info:3};r.sort((a,b)=>ord[a.l]-ord[b.l]);
  return `<div class="card"><h2>${t('Pre-flight check')}</h2>${r.map(x=>`<div class="msg ${x.l}">${t(x.m,...x.a)}</div>`).join('')}</div>`}

function fitPreview(){const w=$('#pvwrap'),p=$('#pv');if(!w||!p)return;const pw=S.print.size==='Letter'?816:794;p.style.zoom=1;fitPapers(p,S.print.fit,pagePx());p.style.zoom=Math.min(1,(w.clientWidth-40)/pw)}

function docInvoice(kind){

  const title={ci:'COMMERCIAL INVOICE',qt:'QUOTATION',pi:'PROFORMA INVOICE',oc:'ORDER CONFIRMATION'}[kind];

}

function salesData(fy){
  const mine=S.shipments.filter(x=>x.date&&fiscal(x.date)===fy&&x.status!=='quote').sort((a,b)=>a.date<b.date?-1:1);
  const mo=Array.from({length:12},(_,i)=>{const mi=(5+i)%12;return {m:mi,y:fy+(mi>=5?0:1),n:0,v:0}});
  mine.forEach(x=>{const m=+x.date.slice(5,7);const o=mo[m>=6?m-6:m+6];o.n++;o.v+=jpyOf(x)});
  const byC={};mine.forEach(x=>{const k=x.cust.name||'—';const o=byC[k]||(byC[k]={n:k,c:x.cust.country||'',cnt:0,v:0});o.cnt++;o.v+=jpyOf(x)});
  mine.forEach(x=>{const k=x.cust.name||'—',r=rate(x.currency);x.items.forEach(it=>{if(num(it.cost)>0){byC[k].rev=(byC[k].rev||0)+lineAmt(it)*r;byC[k].cost=(byC[k].cost||0)+num(it.cost)*num(it.qty)}})});
  const cust=Object.values(byC).sort((a,b)=>b.v-a.v);
  const mrev=cust.reduce((a,c)=>a+(c.rev||0),0),mcost=cust.reduce((a,c)=>a+(c.cost||0),0);
  const total=mine.reduce((a,x)=>a+jpyOf(x),0);
  const out=S.shipments.filter(x=>['order','production','shipped'].includes(x.status)&&balance(x)>0).reduce((a,x)=>a+balance(x)*rate(x.currency),0);
  const pipe=S.shipments.filter(x=>['order','production'].includes(x.status)).reduce((a,x)=>a+jpyOf(x),0);
  const cur2={};mine.forEach(x=>{cur2[x.currency]=(cur2[x.currency]||0)+totals(x).total});
  return {mine,mo,cust,total,out,pipe,cur2,mrev,mcost}}

function mailText(k){const sh=cur(),T=totals(sh),c=S.settings.company;const to=(sh.cust.attn||'Sir or Madam').replace(/^(Mr|Ms|Mrs)\.?\s*/,'$1. ');const greet=`Dear ${to},\n\n`;const sig=`\n\nBest regards,\n${c.signer}\n${c.name}\nTel ${c.tel}`;

/* ========== Cloud sync (Google Sheets via Apps Script) ========== */
let syncing=false,syncTimer=null,lastSyncMs=0,syncUI={s:'off',m:''};
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h+''};
const RK=()=>[['shipments',S.shipments],['customers',S.customers],['products',S.products],['hs',S.hsList]];
const hashRec=r=>hash(JSON.stringify(r,(k,v)=>k==='u'?undefined:v));
const setRec=()=>({company:S.settings.company,bank:S.settings.bank,prefix:S.settings.prefix,nextNo:S.settings.nextNo,rates:S.rates,reminders:S.reminders,print:S.print});
const KEYMISS=['Booking with forwarder','Commercial invoice issued','Packing list issued','Shipping instruction sent','Export declaration / permit'];
function flatOf(k,r){
  if(k==='shipments'){const T=totals(r);return {name:r.invoiceNo,invoiceNo:r.invoiceNo,customer:r.cust.name,date:r.date,etd:r.etd,eta:r.eta,due:dueDate(r),status:r.status,currency:r.currency,total:T.total,balance:balance(r),progress:progress(r),lcExpiry:r.lcExpiry||'',quoteEnd:r.quoteDate&&r.validity?addDays(r.quoteDate,r.validity):'',missing:KEYMISS.filter(x=>!r.checks[x]).join(', ')}}
  return {name:k==='products'?r.desc:k==='hs'?r.code:r.name}}
function stampAll(){const sy=S.sync,H=sy.h;
  RK().forEach(([k,arr])=>{arr.forEach(r=>{if(!r.id)r.id=uid();const key=k+':'+r.id,h=hashRec(r);if(H[key]===undefined){H[key]=h;if(r.u==null)r.u=0}else if(H[key]!==h){H[key]=h;r.u=Date.now()}});
    (sy.ids[k]||[]).forEach(id=>{if(!arr.some(r=>r.id===id)&&!S.deleted.some(d=>d.k===k&&d.id===id))S.deleted.push({k,id,u:Date.now()})});sy.ids[k]=arr.map(r=>r.id)});
  const sh=hash(JSON.stringify(setRec()));if(H['settings:main']===undefined)H['settings:main']=sh;else if(H['settings:main']!==sh){H['settings:main']=sh;sy.setU=Date.now()}}
async function gas(action,payload){const sy=S.sync;const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),40000);
  try{const r=await fetch(sy.url,{method:'POST',body:JSON.stringify(Object.assign({action,token:sy.token},payload||{})),redirect:'follow',signal:ctl.signal});const j=await r.json();if(!j.ok)throw new Error(j.error||'error');return j}finally{clearTimeout(to)}}
function syncLabel(){return syncUI.s==='busy'?tt('Syncing…'):syncUI.s==='ok'?tt('Synced')+' '+(syncUI.t||''):syncUI.s==='err'?'☁ '+tt('Sync error')+(syncUI.m?': '+syncUI.m:''):'☁ '+tt('Not connected')}
function setSyncUI(s,m){syncUI={s,m:m||'',t:s==='ok'?pad2(new Date().getHours())+':'+pad2(new Date().getMinutes()):''};['#syncst','#syncStatus'].forEach(q=>{const e=$(q);if(e){e.textContent=syncLabel();if(q==='#syncst')e.className='syncst '+s}})}
function askAsync(msg){return new Promise(res=>{const d=$('#dlg');d.innerHTML=`<h2>${esc(msg)}</h2><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="ghost" id="askNo">${t('Cancel')}</button><button id="askYes">OK</button></div>`;d.addEventListener('close',()=>res(false),{once:true});d.showModal();$('#askYes').onclick=()=>{res(true);d.close()};$('#askNo').onclick=()=>{res(false);d.close()}})}
function mergeRemote(recs){let changed=false;const sy=S.sync,map={shipments:S.shipments,customers:S.customers,products:S.products,hs:S.hsList};
  recs.forEach(rc=>{
    if(rc.k==='settings'){if(rc.u>(sy.setU||0)&&!rc.del){const o=JSON.parse(rc.json);S.settings.company=o.company||S.settings.company;S.settings.bank=o.bank||S.settings.bank;S.settings.prefix=o.prefix||S.settings.prefix;S.settings.nextNo=Math.max(num(o.nextNo),num(S.settings.nextNo));S.rates=o.rates||S.rates;S.reminders=Object.assign({},S.reminders,o.reminders||{});S.print=Object.assign({},S.print,o.print||{});sy.setU=rc.u;sy.h['settings:main']=hash(JSON.stringify(setRec()));changed=true}return}
    const arr=map[rc.k];if(!arr)return;const i=arr.findIndex(x=>x.id===rc.id),loc=arr[i];
    if(rc.del){if(loc&&(loc.u||0)<=rc.u){arr.splice(i,1);changed=true}return}
    if(!loc||rc.u>(loc.u||0)){const o=JSON.parse(rc.json);o.u=rc.u;if(loc)arr[i]=o;else arr.push(o);sy.h[rc.k+':'+rc.id]=hashRec(o);changed=true}});
  RK().forEach(([k,arr])=>{sy.ids[k]=arr.map(r=>r.id)});
  if(!S.shipments.length){const b=blankShipment();S.shipments.push(b)}
  if(!S.shipments.some(s=>s.id===S.cur))S.cur=S.shipments[0].id;
  return changed}
async function syncNow(manual){const sy=S.sync;
  if(!sy.url||!sy.token){if(manual)toast(tt('Set URL and token first'));return}
  if(syncing)return;syncing=true;setSyncUI('busy');
  try{
    stampAll();const pr=await gas('pull');const recs=pr.records;
    if(!sy.last&&recs.some(r=>r.k==='shipments'&&!r.del)){
      if(!await askAsync(tt('Server already has data. Replace local data with it?'))){syncing=false;setSyncUI('off');return}
      S.shipments=[];S.customers=[];S.products=[];S.hsList=[];sy.h={};sy.ids={};S.deleted=[];sy.setU=0}
    const changed=mergeRemote(recs);stampAll();
    const sm={};recs.forEach(r=>{sm[r.k+':'+r.id]=r.u});const out=[];
    RK().forEach(([k,arr])=>arr.forEach(r=>{const su=sm[k+':'+r.id];if(su===undefined||(r.u||0)>su)out.push({k,id:r.id,u:r.u||0,flat:flatOf(k,r),json:JSON.stringify(r)})}));
    S.deleted.forEach(d=>{const su=sm[d.k+':'+d.id];if(su===undefined||d.u>su)out.push({k:d.k,id:d.id,u:d.u,del:true})});
    const ssu=sm['settings:main'];if(ssu===undefined||(sy.setU||0)>ssu)out.push({k:'settings',id:'main',u:sy.setU||Date.now(),flat:{name:'settings'},json:JSON.stringify(setRec())});
    if(out.length)await gas('push',{records:out});
    S.deleted=[];sy.last=new Date().toISOString();lastSyncMs=Date.now();persist();setSyncUI('ok');
    if(changed){const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))toast(tt('Cloud updated – data refreshed'));else{render();toast(tt('Cloud updated – data refreshed'))}}
  }catch(e){setSyncUI('err',e.name==='AbortError'?'timeout':e.message)}finally{syncing=false}}
function scheduleSync(){const sy=S.sync;if(!sy.auto||!sy.url||!sy.token||!sy.last)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(false),3000)}
window.addEventListener('focus',()=>{if(S.sync.auto&&S.sync.url&&S.sync.last&&Date.now()-lastSyncMs>60000)syncNow(false)});

/* ========== Reminders (in-app; the same rules run daily on the server) ========== */
function remList(){const R=S.reminders,L=s=>String(s==null?'':s).split(/[,\s]+/).filter(Boolean).map(Number),mx=a=>a.length?Math.max(...a):0,t0=todayISO(),out=[];
  const tp=(s,...a)=>{let x=tt(s);a.forEach((v,i)=>{x=x.split('{'+i+'}').join(v)});return x};
  S.shipments.forEach(sh=>{if(sh.status==='paid')return;const who=sh.invoiceNo+' · '+(sh.cust.name||'');const add=(lvl,m)=>out.push({lvl,id:sh.id,who,msg:m});
    if(sh.etd&&['quote','order','production'].includes(sh.status)){const d=diffDays(sh.etd,t0);
      if(d<0)add('late',tp('ETD passed {0} day(s) ago – not marked as shipped',-d));else if(d<=mx(L(R.etd)))add(d===0?'today':'soon',tp('ETD in {0} day(s)',d));
      const miss=KEYMISS.filter(x=>!sh.checks[x]);if(d>=0&&d<=num(R.checkEtd)&&miss.length)add('soon',tp('Before shipment, missing: {0}',miss.map(k=>S.lang==='ja'?(J[k]||k):k).join(', ')))}
    if(sh.eta&&sh.status==='shipped'){const d=diffDays(sh.eta,t0);if(d>=0&&d<=mx(L(R.eta)))add('soon',tp('Arrival (ETA) in {0} day(s)',d))}
    const du=dueDate(sh);if(du&&['order','production','shipped'].includes(sh.status)&&balance(sh)>0){const d=diffDays(du,t0),amt=' '+sym(sh.currency)+' '+fmt(balance(sh));
      if(d<0)add('late',tp('Payment overdue {0} day(s)',-d)+amt);else if(d<=mx(L(R.due)))add(d===0?'today':'soon',tp('Payment due in {0} day(s)',d)+amt)}
    if(sh.lcExpiry){const d=diffDays(sh.lcExpiry,t0);if(d>=0&&d<=mx(L(R.lc)))add('soon',tp('L/C expires in {0} day(s)',d))}
    if(sh.status==='quote'&&sh.quoteDate&&sh.validity){const d=diffDays(addDays(sh.quoteDate,sh.validity),t0);if(d>=0&&d<=mx(L(R.quote)))add('soon',tp('Quotation expires in {0} day(s)',d))}});
  const rk={late:0,today:1,soon:2};return out.sort((a,b)=>rk[a.lvl]-rk[b.lvl])}
function maybeNotify(){try{const n=remList().length;if(!n||!S.reminders.browser||typeof Notification==='undefined'||Notification.permission!=='granted')return;const d=todayISO();if(S.sync.notifyDay===d)return;S.sync.notifyDay=d;persist();new Notification('TSH Export Desk',{body:n+' '+tt('Reminders')})}catch(e){}}

        S.settings[isLogo?'logo':'sigImg']=cv.toDataURL('image/png');save();render()};img.onerror=()=>{S.settings[isLogo?'logo':'sigImg']=rd.result;save();render()};img.src=rd.result};rd.readAsDataURL(f);return}
  if(el.dataset.chk){cur().checks[el.dataset.chk]=el.checked;save();render();return}

function pn(x){x=String(x).replace(/[^\d.,]/g,'');if(!x)return 0;const lc=x.lastIndexOf(','),ld=x.lastIndexOf('.');

function findDates(line){const out=[];const M={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12,januar:1,februar:2,maerz:3,märz:3,mai:5,juni:6,juli:7,okt:10,dez:11};
  const push=(y,m,d)=>{y=+y;m=+m;d=+d;if(y<100)y+=2000;if(m>=1&&m<=12&&d>=1&&d<=31&&y>2000&&y<2100)out.push(y+'-'+pad2(m)+'-'+pad2(d))};let m;
  const r1=/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/g;while(m=r1.exec(line))push(m[1],m[2],m[3]);
  const r2=/(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/g;while(m=r2.exec(line))push(m[3],m[2],m[1]);
  const r3=/(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日/g;while(m=r3.exec(line))push(m[1],m[2],m[3]);
  const r4=/(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-zäÄ]{3,9})\.?,?\s+(\d{4})/g;while(m=r4.exec(line)){const k=M[m[2].toLowerCase()]||M[m[2].toLowerCase().slice(0,3)];if(k)push(m[3],k,m[1])}
  const r5=/([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})/g;while(m=r5.exec(line)){const k=M[m[1].toLowerCase().slice(0,3)];if(k)push(m[3],k,m[2])}
  return out}
function parsePOText(txt){const res={no:'',date:'',etd:'',cust:'',items:[]};const lines=String(txt).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);

  for(const l of lines){const m=/(?:purchase\s*order|p\.?o\.?|order|bestell(?:ung|nummer)?|注文番号|発注番号)\s*(?:no\.?|nr\.?|number|num|#|番号)?\s*[:：#]?\s*([A-Z0-9][A-Z0-9\-\/_.]{3,})/i.exec(l);
    if(m&&/\d/.test(m[1])){res.no=m[1].replace(/[.,;]+$/,'');break}}
  for(const l of lines){const ds=findDates(l);if(!ds.length)continue;
    if(!res.etd&&/deliver|ship|etd|liefer|termin|納期|希望|出荷/i.test(l))res.etd=ds[ds.length-1];
    else if(!res.date&&/date|datum|日付|発注日|注文日|order/i.test(l)&&!/deliver|liefer|納期/i.test(l))res.date=ds[0]}
  if(!res.date)for(const l of lines){const ds=findDates(l);if(ds.length&&!/deliver|ship|etd|liefer|納期|希望/i.test(l)){res.date=ds[0];break}}
  const prods=S.products.filter(p=>p.desc).sort((a,b)=>b.desc.length-a.desc.length);
  lines.forEach(l=>{const ll=l.toLowerCase();let it=null;
    const p=prods.find(p=>ll.includes(p.desc.toLowerCase()));
    if(p){const rest=(l.slice(0,ll.indexOf(p.desc.toLowerCase()))+' '+l.slice(ll.indexOf(p.desc.toLowerCase())+p.desc.length)).replace(/^\s*\d{1,3}(?:[.)]\s*|\s{2,})/,'');
      const nums=(rest.match(/\d[\d.,]*/g)||[]).map(pn).filter(v=>v>0);const q=nums.find(v=>Number.isInteger(v))||0;

      if(m=/^\s*(?:\d{1,3}(?:[.)]\s*|\s{2,}))?(.{4,}?)\s{1,}(\d+(?:[.,]\d+)?)\s*(?:pcs?|pc|st\.?|stk\.?|units?|個|本|x)?\s+(?:[€$¥]|EUR|USD|JPY)?\s*(\d[\d.,]*)\s*(?:€|EUR|USD|JPY)?\s*$/i.exec(l))it={desc:m[1],qty:pn(m[2]),price:pn(m[3])};
      else if(m=/^\s*(\d+)\s*(?:x|pcs?|st\.?|stk\.?|個)\s+(.{4,}?)(?:\s+(?:[€$¥]|EUR|USD)?\s*(\d[\d.,]*))?\s*$/i.exec(l))it={desc:m[2],qty:pn(m[1]),price:m[3]?pn(m[3]):0}}

  const cm=e.target.closest('[data-cmd]');if(cm){cmdRun(+cm.dataset.cmd);return}
  if(view==='docs'&&docMode==='view'&&e.target.closest('#pv')){docMode='edit';edTab=(docTab==='pl'||docTab==='cm')?'pack':'info';render();return}
  const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;const f=A[b.dataset.a];if(f)f(b.dataset,b)});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();cmdOpen();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();doBackup();return}
  if(e.target.id==='cmdIn'){const n=(cmdRender.items||[]).length;
    if(e.key==='ArrowDown'){e.preventDefault();cmdIdx=(cmdIdx+1)%Math.max(n,1);cmdRender()}
    else if(e.key==='ArrowUp'){e.preventDefault();cmdIdx=(cmdIdx-1+n)%Math.max(n,1);cmdRender()}
    else if(e.key==='Enter'){e.preventDefault();cmdRun(cmdIdx)}}});

(function(){const m=/[#&]connect=([^&]+)/.exec(location.hash);if(!m)return;try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(o.u&&o.t){S.sync.url=o.u;S.sync.token=o.t;save();history.replaceState(null,'',location.pathname+location.search);render();syncNow(true)}}catch(e){}})();

if(S.sync.url&&S.sync.token&&S.sync.last&&S.sync.auto)syncNow(false);
